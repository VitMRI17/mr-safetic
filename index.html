<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR-SafeTic — sécurité IRM, analyse de risque implant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1216; --ink-2:#3A434C; --ink-3:#6B757E;
  --paper:#FBFBFA; --card:#FFFFFF; --line:#DFE2E4; --line-2:#C7CCD0;
  --r0:#0B6E4F; --r1:#B08900; --r2:#D97316; --r3:#B7410E; --r4:#9E1B1B;
  --r0bg:#E6F2EC; --r1bg:#FAF2D8; --r2bg:#FCEBDA; --r3bg:#F9E3D9; --r4bg:#F7E0E0;
  --bore:#EEF1F3; --skin:#D8DDE1;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius:12px; --radius-s:8px; --radius-xs:5px;
  --shadow-sm:0 1px 2px rgba(20,24,28,.04),0 2px 6px rgba(20,24,28,.045);
  --shadow-md:0 2px 4px rgba(20,24,28,.05),0 10px 24px rgba(20,24,28,.07);
  --ease:cubic-bezier(.2,.7,.3,1);
}
@media(prefers-color-scheme:dark){
:root{--ink:#EDEFF1;--ink-2:#AEB6BD;--ink-3:#7C868E;--paper:#0E1216;--card:#171C21;
 --line:#2A3138;--line-2:#3A434C;--r0:#4FBF95;--r1:#DFC047;--r2:#EF9A4E;--r3:#E07248;--r4:#E06666;
 --r0bg:#12261F;--r1bg:#2A2412;--r2bg:#2C1F12;--r3bg:#2C1A12;--r4bg:#2C1414;
 --bore:#1D242A;--skin:#39424A;
 --shadow-sm:0 1px 2px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.28);
 --shadow-md:0 2px 6px rgba(0,0,0,.28),0 12px 28px rgba(0,0,0,.36);}
}
@media(prefers-reduced-motion:reduce){
 *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.shell{max-width:800px;margin:0 auto;padding:0 20px 80px}

header{border-bottom:1px solid var(--line);padding:22px 0 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand{font-family:var(--cond);font-weight:600;font-size:20px;line-height:1.15}
.brand span{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.ver{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;padding-top:4px;white-space:nowrap}

.fields{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-top:none;background:var(--card);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.fld{padding:11px 10px 12px;border-right:1px solid var(--line);position:relative}
.fld:last-child{border-right:none}
.fld-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
.fld-n{font-family:var(--cond);font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.25}
.fld-s{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:7px;color:var(--line-2);font-variant-numeric:tabular-nums;line-height:1}
.fld-bar{height:3px;background:var(--line);margin-top:8px;overflow:hidden}
.fld-bar i{display:block;height:100%;width:0;background:var(--line-2);transition:width .3s ease,background .3s ease}
.fld[data-on="1"]::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--ink)}

h2{font-family:var(--cond);font-size:22px;font-weight:600;margin:32px 0 4px;line-height:1.25}
h2 em{font-family:var(--mono);font-style:normal;font-size:15px;font-weight:400;color:var(--ink-3)}
.sub{color:var(--ink-3);font-size:13.5px;margin-bottom:20px;max-width:64ch}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:28px 0 10px}

.q{margin:24px 0 0}
.q-l{font-size:15.5px;font-weight:500;line-height:1.45;margin-bottom:3px}
.q-h{font-size:13px;color:var(--ink-3);line-height:1.5;margin-bottom:11px;max-width:66ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-xs);
  padding:11px 14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:11px;line-height:1.4;
  transition:border-color .15s var(--ease),transform .15s var(--ease),box-shadow .15s var(--ease)}
.opts.row .opt{flex:1 1 auto;min-width:92px;justify-content:center;text-align:center}
.opt:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.opt:active{transform:translateY(0)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.opt.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.opts.row .opt.on{box-shadow:inset 0 -3px 0 var(--ink)}
.opt-t{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto;flex-shrink:0}

.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.f{background:var(--card);padding:11px 13px 12px}
.f label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
select,input[type=range]{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius-xs);padding:7px 8px;transition:border-color .15s var(--ease)}
select:hover,input:hover{border-color:var(--ink-3)}
select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--ink)}
.hval{font-family:var(--mono);font-size:13px;margin-top:3px}
.fh{font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:5px}

.panel{border:1px solid var(--line);background:var(--card);margin-top:14px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);gap:12px}
.panel-t{font-family:var(--cond);font-size:15px;font-weight:600}
.panel-s{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:right}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:10px;border:1px solid var(--line-2)}

.tabs{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-bottom:none;margin-top:22px;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
.tab{flex:1;background:var(--card);border:none;font-family:var(--cond);font-weight:600;font-size:13.5px;color:var(--ink-3);padding:11px 6px;cursor:pointer}
.tab.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}

.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.rc{background:var(--card);padding:13px 14px}
.rc-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rc-n{font-family:var(--cond);font-size:13.5px;font-weight:600;color:var(--ink-2);margin:2px 0 7px}
.rc-v{font-family:var(--cond);font-size:15px;font-weight:600;line-height:1.2}
.rc-w{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.45}

button.act{font-family:var(--cond);font-weight:600;font-size:15px;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius-xs);padding:12px 22px;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease),opacity .15s}
button.act:hover:not([disabled]){transform:translateY(-1px);box-shadow:var(--shadow-md)}
button.act:active:not([disabled]){transform:translateY(0)}
button.act[disabled]{opacity:.32;cursor:not-allowed}
button.gh{background:none;color:var(--ink);border:1px solid var(--line-2);border-radius:var(--radius-xs);font-family:var(--sans);font-weight:500;font-size:14px;padding:10px 18px;cursor:pointer;transition:border-color .15s var(--ease),transform .15s var(--ease),background .15s var(--ease)}
button.gh:hover{border-color:var(--ink);transform:translateY(-1px)}
button.gh:active{transform:translateY(0)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}

.gate{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:24px;margin-top:28px}
.gate h3{font-family:var(--cond);font-size:17px;font-weight:600;margin-bottom:12px}
.gate p{font-size:13.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.62}
.gate ul{margin:0 0 14px 18px;font-size:13.5px;color:var(--ink-2)}
.gate li{margin-bottom:7px;line-height:1.55}
.chk{display:flex;gap:11px;align-items:flex-start;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.5}
.chk input{margin-top:3px;width:17px;height:17px;flex-shrink:0;accent-color:var(--ink)}

.verdict{border:1px solid;border-radius:var(--radius);box-shadow:var(--shadow-md);padding:20px 22px;margin:8px 0 18px}
.verdict-k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;opacity:.85}
.verdict-t{font-family:var(--cond);font-size:24px;font-weight:600;margin:5px 0 8px;line-height:1.2}
.verdict-b{font-size:14px;line-height:1.62;max-width:64ch}
.scale{display:flex;border:1px solid var(--line);border-radius:var(--radius-xs);overflow:hidden;margin-bottom:20px}
.scale div{flex:1;padding:7px 6px;font-family:var(--mono);font-size:9.5px;text-align:center;border-right:1px solid var(--line);line-height:1.3}
.scale div:last-child{border-right:none}
.mit{border-left:3px solid var(--ink);background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 var(--radius-xs) var(--radius-xs) 0;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:9px}
.mit-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.mit-b{font-size:13.5px;line-height:1.55}
.expert{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px 22px;margin-top:22px}
.expert-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.expert-t{font-family:var(--cond);font-size:17px;font-weight:600}
.expert-s{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.expert-b{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-top:12px;max-width:64ch}
.expert-w{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:10px;max-width:64ch}
.expert-w strong{color:var(--ink-2)}
.dot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex-shrink:0}
.mono-sel{font-family:var(--mono);font-size:12px;color:var(--ink-2);user-select:all}
.help{margin-top:12px}
.syms{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0 14px}
.syms figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-xs);padding:14px 10px 12px;text-align:center}
.syms figure>div{color:var(--ink);line-height:0}
.syms figcaption{margin-top:9px;line-height:1.35}
.syms figcaption strong{display:block;font-family:var(--cond);font-size:13.5px;font-weight:600;color:var(--ink)}
.syms figcaption span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.help .dbody p{margin-bottom:9px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.cmpo{font-family:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xs);padding:11px 13px;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;
  transition:border-color .15s var(--ease),transform .15s var(--ease),box-shadow .15s var(--ease)}
.cmpo:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.cmpo:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.cmpo.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.cmpo-n{font-size:13px;color:var(--ink);line-height:1.35}
.cmpo-l{font-family:var(--cond);font-weight:600;font-size:13.5px;line-height:1.25}
.cmpo-d{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
#srcs{margin-top:36px}
.srct{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;margin-top:4px}
.dbody table.srct{font-family:var(--sans);font-size:12.5px}
.dbody .srct td:first-child{white-space:normal;padding-right:10px}
.srct td,.srct th{white-space:normal;overflow-wrap:anywhere}
.srct th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;font-weight:400;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
.srct td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);color:var(--ink-2);line-height:1.45;vertical-align:top}
.srct td:nth-child(2){color:var(--ink-3)}
.srct th:nth-child(1),.srct td:nth-child(1){width:48%}
.srct th:nth-child(2),.srct td:nth-child(2){width:29%}
.srct th:nth-child(3),.srct td:nth-child(3){width:23%}
.st{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border:1px solid;border-radius:3px;white-space:nowrap;display:inline-block}
.refs{margin-top:20px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.refs li{margin-bottom:9px;list-style:none;padding-left:16px;text-indent:-16px}
.refs a{color:var(--ink-3)}
@media(max-width:560px){.srct{font-size:11.5px}.srct td{padding:7px 6px 7px 0}}
.trace{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:1.8;border-top:1px solid var(--line);padding-top:16px;margin-top:24px}
.trace b{color:var(--ink-2);font-weight:500}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xs);margin-top:14px}
.note strong{color:var(--ink-2)}
details{margin-top:12px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-xs);overflow:hidden}
summary{padding:11px 14px;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:14px;list-style:none;transition:background .15s var(--ease)}
summary:hover{background:var(--paper)}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--ink-3)}
details[open] summary::before{content:"▾ "}
.dbody{padding:0 14px 14px;font-size:13px;color:var(--ink-2);line-height:1.6}
.dbody table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px;margin-top:6px}
.dbody td{border-bottom:1px solid var(--line);padding:4px 8px 4px 0;color:var(--ink-3);vertical-align:top}
.dbody td:first-child{color:var(--ink-2);white-space:nowrap;padding-right:14px}
@media(max-width:560px){
 .fld-n{font-size:11px}.fld-s{font-size:16px}.fld{padding:9px 7px 10px}
 .brand{font-size:18px}h2{font-size:20px}.tab{font-size:12px}
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#main.enter{animation:fadeInUp .32s var(--ease) both}
.tab{transition:color .15s var(--ease)}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand"><a href="#" id="home-link" style="color:inherit;text-decoration:none">MR-SafeTic</a>
    <span>Sécurité IRM — analyse de risque implant · outil pédagogique, ne remplace pas l'avis médical</span></div>
  <div class="ver">v0.5</div>
</header>
<div class="fields" id="fields"></div>
<main id="main"></main>
<footer id="srcs"></footer>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   TABLE D'HYPOTHÈSES — regroupe toutes les valeurs à valider.
   Les corriger ici ne demande aucune modification ailleurs.
   ══════════════════════════════════════════════════════════════ */
const HYP = {
  boreLen:160, boreDia:70, tableDrop:12,

  rfLen:60,        // antenne corps — mesure directe Ingenia 1.5T
  /* Deux mécanismes distincts, à ne pas confondre.
     rfFalloff — ANTENNE CORPS : le B1 ne s'arrête pas net au bord de l'antenne,
     il décroît. La bande s'applique à tout dispositif, compact ou non.
     rfReach — ANTENNE LOCALE BLINDÉE : le champ est confiné, il n'y a pas de
     débordement. Seul le TRAJET d'un conducteur peut franchir la frontière,
     et l'outil pose alors la question plutôt que de la déduire. */
  rfFalloff:15,   // SEULE valeur encore non ancrée du modèle RF
  rfReach:45,
  /* FOV maximal en z sur l'Ingenia 1,5 T ; en pratique 30 cm (rachis) à 40 cm.
     Consigné pour mémoire seulement : le FOV ne borne EN RIEN la zone exposée.
     L'antenne corps émet dans tout son volume quel que soit le FOV prescrit ;
     la sélectivité de coupe vient du gradient appliqué pendant l'impulsion, pas
     d'une restriction de l'émission. Un échauffement d'implant ne dépend pas de
     la résonance des spins mais du champ électrique induit, présent partout
     dans l'antenne. Le FOV agit sur le SAR, pas sur sa répartition spatiale. */
  fovZ:50,
  headCoilLen:31,  // antenne tête 8 canaux émission-réception, Ingenia 1,5 T : boîtier
                   // mesuré à 31 × 31 cm. Le volume d'émission actif est plus court que
                   // le boîtier : retenir la valeur mesurée surestime légèrement le
                   // volume exposé, ce qui va dans le sens prudent.
  kneeCoilLen:20,  // antenne genou émission-réception — NON VALIDÉ : le parc de référence
                   // n'en comporte pas (genou réceptrice seule sur l'Ingenia 1,5 T)

  land:{
    vertex:{n:"Vertex / crâne",f:.045}, orbite:{n:"Orbites",f:.065},
    cou:{n:"Rachis cervical",f:.115}, epaule:{n:"Épaule",f:.175},
    pectoral:{n:"Loge pectorale",f:.215}, coeur:{n:"Cœur",f:.245},
    dorsal:{n:"Rachis dorsal",f:.260}, xiphoide:{n:"Appendice xiphoïde",f:.285},
    abdomen:{n:"Abdomen / ombilic",f:.360}, lombaire:{n:"Rachis lombaire",f:.385},
    bassin:{n:"Bassin / hanche",f:.470}, cuisse:{n:"Cuisse",f:.575},
    genou:{n:"Genou",f:.715}, jambe:{n:"Jambe",f:.840}, cheville:{n:"Cheville / pied",f:.960},
    msup:{n:"Membre supérieur",f:.320}
  },

  exams:{
    crane:{n:"Crâne / encéphale",cible:"vertex",pos:"dos",ent:"tete"},
    orl:{n:"Massif facial / ORL",cible:"orbite",pos:"dos",ent:"tete"},
    cervical:{n:"Rachis cervical",cible:"cou",pos:"dos",ent:"tete"},
    epaule:{n:"Épaule",cible:"epaule",pos:"dos",ent:"tete"},
    cardiaque:{n:"Cardiaque",cible:"coeur",pos:"dos",ent:"tete"},
    sein:{n:"Sein",cible:"pectoral",pos:"ventre",ent:"tete"},

/* ---------- géométrie ---------- */
function dOf(k){ return HYP.land[k].f*S.h; }
function bOf(k){
  const dC=dOf(HYP.exams[S.ex].cible);
  return S.ent==="tete" ? (dOf(k)-dC) : (dC-dOf(k));
}
function rfLen(){ return S.coil==="body"?HYP.rfLen:S.coil==="head"?HYP.headCoilLen:HYP.kneeCoilLen; }
function localCoil(){ return S.coil!=="body"; }
function rfZones(){
  const h=rfLen()/2;
  /* Antenne corps : le champ lui-même déborde. La bande intermédiaire est une
     décroissance réelle de B1, elle concerne tous les dispositifs. */
  if(!localCoil()) return [[0,h,2],[h,h+HYP.rfFalloff,1],[h+HYP.rfFalloff,95,0]];
  /* Antenne locale blindée : champ confiné. La bande ne marque plus un champ
     mais la région d'où le trajet d'un conducteur peut encore l'atteindre —
     sans objet pour un dispositif compact. */
  return S.linear==="yes"
    ? [[0,h,2],[h,h+HYP.rfReach,1],[h+HYP.rfReach,95,0]]
    : [[0,h,2],[h,95,0]];
}
function zonesFor(f){ return f==="B1"?rfZones():f==="dB/dt"?HYP.zonesDbdt:f==="dB/dx"?HYP.zonesDbdx:[[0,95,2]]; }
function levelAt(f,b){ const a=Math.abs(b); for(const[lo,hi,l] of zonesFor(f)) if(a>=lo&&a<hi) return l; return 0; }
function radialLevel(){ const d=HYP.lat[S.lat].d; for(const[lo,hi,l] of HYP.radial) if(d>=lo&&d<hi) return l; return 2; }
function inBore(){ return Math.abs(bOf(S.imp))<=HYP.boreLen/2; }

/* Exposition géométrique par champ, 0–2.
   dB/dx est un cas à part : tout implant qui entre dans le tunnel traverse
   la zone de gradient spatial maximal. Sa position au moment de
   l'acquisition ne dit rien du risque — c'est le trajet qui compte. */
function expo(f){
  const b=bOf(S.imp);
  if(f==="dB/dx") return inBore()?2:1;
  if(f==="B0")    return inBore()?2:1;
  return levelAt(f,b);
}

function figTransform(view){
  const k=S.h/170, dC=dOf(HYP.exams[S.ex].cible), sgn=S.ent==="tete"?1:-1;
  return view==="sag"
    ? `matrix(0 ${-k} ${sgn*k} 0 ${-sgn*dC} ${HYP.tableDrop})`
    : `matrix(0 ${k} ${sgn*k} 0 ${-sgn*dC} 0)`;
}
function smoothPath(p){
  let d=`M ${p[0][0]} ${p[0][1]}`;
  for(let i=1;i<p.length-1;i++){
    const[x,y]=p[i],[x2,y2]=p[i+1];
    d+=` Q ${x} ${y} ${((x+x2)/2).toFixed(1)} ${((y+y2)/2).toFixed(1)}`;
  }
  const l=p[p.length-1]; return d+` L ${l[0]} ${l[1]}`;
}
function body(view){
  const lateral=S.pos==="latg"||S.pos==="latd";
  const fill=`fill="var(--skin)" stroke="var(--line-2)" stroke-width=".55" stroke-linejoin="round"`;
  /* en décubitus latéral, les deux vues échangent leurs profils */
  const useCor = (view==="cor") !== lateral;
  let inner;
  if(useCor){ inner=COR_FIG; }
  else {
    const pts=SAG_PROF.map(([v,u])=>[u,v]);
    const d=smoothPath(pts)+` L 0 ${SAG_PROF[SAG_PROF.length-1][0]} L 0 ${SAG_PROF[0][0]} Z`;
    inner=`<path d="${d}"/>`;
  }
  /* la vue coronale est centrée sur l'axe ; la sagittale repose sur la table */
  const off = useCor && view==="sag" ? ` transform="translate(0 -19)"` : "";
  return `<g ${fill} transform="${figTransform(view)}"><g${off}>${inner}</g></g>`;
}

/* ---------- bandes d'exposition ----------
   Vue sagittale : bandes axiales seules.
   Vue coronale : grille discrète axiale × radiale — le couplage augmente
   en s'éloignant de l'axe du tunnel, sauf pour B0 qui est homogène. */
function bands(f,view){
  const R=HYP.boreDia/2, radial=(view==="cor"&&f!=="B0"), out=[];
  /* la modulation radiale ne change pas le niveau, elle module son intensité :
     même couleur, trois crans discrets — jamais un dégradé continu */
  const rows = radial
    ? [[-R,-16,1.7],[-16,-9,1.0],[-9,9,.45],[9,16,1.0],[16,R,1.7]]
    : [[-R,R,1]];
  zonesFor(f).forEach(([lo,hi,l])=>{
    [[lo,hi],[-hi,-lo]].forEach(([a,bb])=>{
      const x=Math.max(a,-95), w=Math.min(bb,95)-x; if(w<=0) return;
      rows.forEach(([y0,y1,m])=>{
        const op=(l===0?1:m)*EXPO[l].a;
        out.push(`<rect x="${x}" y="${y0}" width="${w}" height="${(y1-y0).toFixed(1)}" fill="var(${EXPO[l].c})" opacity="${op.toFixed(3)}"/>`);
        if(l===1) out.push(`<rect x="${x}" y="${y0}" width="${w}" height="${(y1-y0).toFixed(1)}" fill="url(#h)" opacity="${(.4*(l===0?1:m)).toFixed(2)}"/>`);
      });
    });
  });
  if(radial) [-16,-9,9,16].forEach(y=>
    out.push(`<line x1="-95" y1="${y}" x2="95" y2="${y}" stroke="var(--ink-3)" stroke-width=".35" stroke-dasharray="1.5 2" opacity=".5"/>`));
  return out.join("");
}

function draw(view){
  const R=HYP.boreDia/2, HL=HYP.boreLen/2, f=S.tab;
  const b=bOf(S.imp), latD=HYP.lat[S.lat].d;
  const antRegion=["pectoral","coeur","abdomen"].includes(S.imp);
  const sgnLat=S.lat==="central"?0:(antRegion?-1:1);
  let s=`<defs><pattern id="h" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="4" stroke="var(--ink-3)" stroke-width=".7"/></pattern>
    <clipPath id="cb"><rect x="${-HL}" y="${-R}" width="${2*HL}" height="${2*R}"/></clipPath></defs>`;
  s+=`<rect x="${-HL}" y="${-R}" width="${2*HL}" height="${2*R}" fill="var(--bore)" stroke="var(--line-2)" stroke-width=".8"/>`;
  s+=`<g clip-path="url(#cb)">${bands(f,view)}</g>`;
  if(view==="sag") s+=`<rect x="${-HL}" y="${HYP.tableDrop}" width="${2*HL}" height="2" fill="var(--line-2)"/>`;
  s+=`<g clip-path="url(#cb)" opacity=".92">${body(view)}</g>`;
  s+=`<line x1="0" y1="${-R-3}" x2="0" y2="${R+3}" stroke="var(--ink)" stroke-width=".7" stroke-dasharray="3 2"/>`;
  s+=`<text x="2" y="${R-2.6}" font-family="var(--mono)" font-size="3.2" fill="var(--ink)">ISOCENTRE</text>`;
  for(let x=-80;x<=80;x+=20){ if(!x)continue;
    s+=`<line x1="${x}" y1="${R}" x2="${x}" y2="${R+2}" stroke="var(--ink-3)" stroke-width=".5"/>`;
    s+=`<text x="${x}" y="${R+6.5}" text-anchor="middle" font-family="var(--mono)" font-size="3.1" fill="var(--ink-3)">${Math.abs(x)}</text>`;}
  s+=`<text x="${HL-2}" y="${-R-4.5}" text-anchor="end" font-family="var(--mono)" font-size="3.2" fill="var(--ink-3)">ENTRÉE ▸</text>`;
  if(view==="cor"&&f!=="B0")
    s+=`<text x="${-HL+2}" y="${-R+4.4}" font-family="var(--mono)" font-size="3" fill="var(--ink-3)">COUPLAGE CROISSANT VERS LA PAROI</text>`;
  const ant=HYP.tableDrop-19, post=HYP.tableDrop-4;
  const iy=view==="sag"?(S.pos==="ventre"?(antRegion?post:ant):(antRegion?ant:post)):(sgnLat*latD);
  const lv=f==="dB/dx"||f==="B0"?expo(f):levelAt(f,b);
  const col=`var(${EXPO[lv].c})`;
  const bl=Math.max(-70,Math.min(70,b)), anc=b>56?"end":b<-56?"start":"middle";
  const g=(GLYPH[S.kind]||GLYPH.inconnu)(col);
  s+=`<line x1="${b}" y1="${iy-5}" x2="${bl}" y2="${-R-9}" stroke="var(--ink-3)" stroke-width=".5"/>
   <g transform="translate(${b} ${iy})"><circle r="8.4" fill="var(--paper)" opacity=".55"/>
   <circle r="8.4" fill="none" stroke="${col}" stroke-width=".7" opacity=".65"/>${g}</g>
   <text x="${bl}" y="${-R-11.5}" text-anchor="${anc}" font-family="var(--cond)" font-weight="600" font-size="4.2" fill="var(--ink)">${HYP.land[S.imp].n}</text>
   <text x="${bl}" y="${-R-6.6}" text-anchor="${anc}" font-family="var(--mono)" font-size="3.2" fill="var(--ink-3)">${devShort().toUpperCase()} · ${Math.round(Math.abs(b))} CM${inBore()?"":" · HORS TUNNEL"}</text>`;
  return s;
}

STEPS[6]={
  render(){

      "Bandage compressif, contention externe, immobilisation mécanique.",
      [{l:"Oui",v:"yes"},{l:"Non",v:"no"}],true));
    qs.push(Q("tissue",`Le dispositif (${devShort()}) est-il au contact d'un tissu où un déplacement serait dangereux ?`,

      [{l:"Non",v:"no"},{l:"Oui",v:"yes"},{l:"Inconnu",v:"unknown"}],true));
    if(S.cond!=="no") qs.push(Q("slow","Le déplacement du patient dans le tunnel peut-il être ralenti et contrôlé ?",
      "Un déplacement lent limite les forces de Lenz induites dans tout matériau conducteur, même non ferromagnétique.",
      [{l:"Oui",v:"yes"},{l:"Non",v:"no"}],true));
    if(S.kind==="actif"){
      qs.push(Q("funcB0","La fonction du dispositif est-elle altérée par le champ statique ou son gradient spatial ?",
        "Commutateur magnétique, reprogrammation, passage en mode asynchrone, arrêt de stimulation.",
        [{l:"Non",v:"no"},{l:"Oui",v:"yes"},{l:"Inconnu",v:"unknown"}],true));
      qs.push(Q("dependent","La santé du patient dépend-elle du fonctionnement continu du dispositif ?",
        "Patient stimulodépendant, suppléance vitale, perfusion continue.",
        [{l:"Non",v:"no"},{l:"Oui",v:"yes"},{l:"Inconnu",v:"unknown"}],true));
    }
    this.qs=qs;
    return `<h2>Forces mécaniques <em>B0 · dB/dx</em></h2>
    <div class="sub">Le champ statique exerce un couple de rotation, homogène dans tout le volume d'imagerie et présent en permanence. Le gradient spatial exerce une force de translation, proche de zéro à l'isocentre et maximale aux extrémités du tunnel — le moment critique est donc le passage du patient, pas l'acquisition.</div>
    ${qs.map(q=>q.html).join("")}
    <div class="actions"><button class="act" id="next"${this.ready()?"":" disabled"}>Suivant</button></div>`;
  },
  bind(){ bindAll(this.qs); },
  ready(){
    if(S.anchored!=="yes"&&!S.securable) return false;
    if(!S.tissue) return false;
    if(S.cond!=="no"&&!S.slow) return false;
    if(S.kind==="actif"&&!(S.funcB0&&S.dependent)) return false;
    return true;
  },
  score(){
    let base=S.ferro==="no"?0:S.ferro==="unknown"?2:3;
    const w0=[],wx=[];
    if(S.ferro==="no"){ w0.push("Matériau non ferromagnétique : pas de couple significatif."); }
    else if(S.ferro==="unknown"){ w0.push("Ferromagnétisme non documenté : traité par précaution comme potentiellement ferromagnétique."); }
    if(S.ferro!=="no"){
      if(S.anchored==="yes"){ base-=1; w0.push("Ancrage stable : déplacement peu probable."); }
      else if(S.securable==="yes"){ base-=1; S.mitig.push(["Immobilisation","Immobiliser le dispositif avant l'entrée en zone IV et vérifier la contention après installation du patient."]); }
      else { base+=1; w0.push("Dispositif ni ancré ni immobilisable."); }
      if(S.tissue==="yes"){ base+=1; w0.push("Voisinage d'un tissu sensible au déplacement."); }
      else if(S.tissue==="unknown") w0.push("Localisation tissulaire imprécise.");
    }
    let s0=base; if(!inBore()){ s0-=1; w0.push("Dispositif hors du volume de l'aimant."); }
    let sx=base;
    wx.push(...w0.filter(x=>!x.startsWith("Dispositif hors")));
    if(S.cond!=="no"){
      if(sx<1){ sx=1; wx.push("Matériau conducteur : forces de Lenz possibles au passage, même sans ferromagnétisme."); }
      if(S.slow==="yes"){ sx=Math.max(0,sx-1); S.mitig.push(["Vitesse de déplacement","Faire progresser le patient lentement à l'entrée et à la sortie du tunnel : les forces de Lenz croissent avec la vitesse."]); }
      else { sx+=1; wx.push("Déplacement lent non réalisable."); }
    }
    if(inBore()) wx.push("Le dispositif traverse la zone de gradient spatial maximal à l'entrée et à la sortie.");
    if(S.kind==="actif"&&(S.funcB0==="yes"||S.funcB0==="unknown")){
      s0+=1; sx+=1; const t="Fonction du dispositif potentiellement altérée par le champ.";
      w0.push(t); wx.push(t);
      if(S.dependent==="yes"){ s0+=2; sx+=2; const u="Patient dépendant du dispositif : une altération de fonction a une conséquence directe."; w0.push(u); wx.push(u); }
      else if(S.dependent==="unknown"){ s0+=1; sx+=1; }
      S.mitig.push(["Encadrement du dispositif actif","Faire valider le mode de programmation et la surveillance péri-examen par le service référent avant l'installation."]);
    }
    return [{i:0,s:clamp(s0),w:w0},{i:1,s:clamp(sx),w:wx}];
  }
};

      else if(S.tipExcit==="other"){ s+=1; w.push("Extrémité au contact d'un tissu excitable."); }
      else if(S.tipExcit==="unknown"){ s+=1; w.push("Position de l'extrémité non établie."); }
      if(s>=2){
        if(S.gradMitig==="yes"){ s-=1; S.mitig.push(["Adaptation de séquence","Réduire l'amplitude maximale de gradient : champ de vue élargi, coupes plus épaisses, séquences moins agressives."]); }
        else w.push("Adaptation de séquence non réalisable.");
      }
    } else {
      s=z===2?1:0;
      if(S.vibr==="yes"){ s+=2; w.push("Risque de vibration induite retenu."); }
      else if(S.vibr==="unknown"){ s+=1; w.push("Risque de vibration non établi."); }
      if(!s) w.push("Dispositif compact, hors de la zone de gradient maximal.");
    }
    if(S.kind==="actif"){ s+=1; w.push("Dispositif actif : tensions et courants induits susceptibles de perturber la fonction."); }
    return [{i:2,s:clamp(s),w}];
  }
};

/* Comparateur d'antennes d'émission. L'antenne n'est pas seulement un fait à
   enregistrer : quand plusieurs sont disponibles, c'est un levier que le TRM
   peut actionner. L'outil montre ce que chacune change, il ne choisit pas. */
function expoFor(coil){
  const save=S.coil; S.coil=coil;
  let e=expo("B1"); const L=rfLen();
  S.coil=save; return {e,L};
}
function coilCompare(){
  return Object.entries(COIL).map(([k,n])=>{
    const {e,L}=expoFor(k);
    const lbl=(e===1&&k!=="body"&&S.linear==="yes")?"Selon le trajet du conducteur":EXPO[e].n;
    return `<button type="button" class="cmpo${k===S.coil?" on":""}" data-c="${k}">
      <span class="cmpo-n">${n}</span>
      <span class="cmpo-l" style="color:var(${EXPO[e].c})">${lbl}</span>
      <span class="cmpo-d">${L} cm</span></button>`;
  }).join("");
}

/* Symboles d'antenne, famille IEC 60417. Le sens des têtes de flèche donne la
   fonction : vers le centre = émission, vers l'extérieur = réception, les deux
   = émission-réception (6192). Dessinés uniquement dans l'aide, repliée par
   défaut. */
function coilSymbol(kind){
  /* Bras construit le long de +x depuis le centre (50,50), puis répété par
     rotation. x croissant = on s'éloigne du centre. */
  const zig=(a,b)=>{
    const n=Math.max(4,Math.round((b-a)/3.2)), st=(b-a)/n; let d=`M ${a.toFixed(1)} 50`;
    for(let i=1;i<=n;i++) d+=` L ${(a+i*st).toFixed(1)} ${i===n?50:(50+(i%2?-2.5:2.5)).toFixed(1)}`;
    return `<path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  const IN=62, OUT=86, H=6.2;
  const headIn =`<path d="M ${IN} 50 L ${IN+H} 46.4 L ${IN+H} 53.6 Z" fill="currentColor"/>`;
  const headOut=`<path d="M ${OUT} 50 L ${OUT-H} 46.4 L ${OUT-H} 53.6 Z" fill="currentColor"/>`;
  let arm;
  if(kind==="tx")      arm=headIn+zig(IN+H,OUT);
  else if(kind==="rx") arm=zig(IN,OUT-H)+headOut;
  else                 arm=headIn+zig(IN+H,OUT-H)+headOut;
  const arms=[45,135,225,315].map(a=>`<g transform="rotate(${a} 50 50)">${arm}</g>`).join("");
  return `<svg viewBox="0 0 100 104" width="88" height="92" role="img" aria-hidden="true">
    <path d="M 43.4 87.4 A 38 38 0 1 1 56.6 87.4" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 44.3 88.2 Q 42.4 95 44.4 101" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 55.7 88.2 Q 57.6 95 55.6 101" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    ${arms}</svg>`;
}

/* Aide contextuelle sur la nature de l'antenne. C'est l'entrée la plus
   susceptible d'être mal renseignée, et une erreur y sous-estime le risque. */
function helpCoil(){
  return `<details class="help"><summary>Comment savoir si mon antenne émet, reçoit, ou les deux ?</summary>
  <div class="dbody">
  <p><strong>L'information est sur l'antenne, pas sur la console.</strong> Le système n'indique pas si l'antenne en place émet ou se contente de recevoir. Il faut regarder l'antenne elle-même.</p>
  <p><strong>1. Le symbole normalisé.</strong> Les antennes portent un pictogramme défini par la norme IEC 60417, qui recense les symboles graphiques apposés sur les équipements. Le sens des flèches donne la fonction :</p>
  <div class="syms">
    <figure><div>${coilSymbol("tx")}</div><figcaption><strong>Émission</strong><span>Têtes vers le centre</span></figcaption></figure>
    <figure><div>${coilSymbol("rx")}</div><figcaption><strong>Réception</strong><span>Têtes vers l'extérieur</span></figcaption></figure>
    <figure><div>${coilSymbol("tr")}</div><figcaption><strong>Émission-réception</strong><span>Têtes dans les deux sens</span></figcaption></figure>
  </div>
  <p><strong>2. Le marquage écrit.</strong> Les mentions « T/R », « Tx/Rx » ou « transmit/receive » désignent une antenne émettrice-réceptrice ; « Rx » seul désigne une antenne réceptrice.</p>
  <p><strong>3. Son aspect.</strong> Une antenne tête émettrice-réceptrice est une cage d'oiseau : un cylindre à barreaux réguliers. Une antenne réceptrice multicanaux est un assemblage dense d'éléments.</p>
  <p><strong>4. Sa notice</strong> le précise explicitement, ainsi que ses conditions d'utilisation.</p>
  <p style="margin-top:12px"><strong>Si le doute persiste :</strong> demander au physicien médical ou au spécialiste d'application. En attendant, retenir l'antenne corps du tunnel — c'est l'hypothèse qui ne sous-estime jamais l'exposition.</p>
  <p style="margin-top:12px;color:var(--ink-3)">Pourquoi cela compte : une antenne réceptrice ne modifie en rien le volume irradié. Se tromper ici en déclarant une antenne locale alors que l'émission vient du tunnel produit une estimation faussement rassurante.</p>
  </div></details>`;
}

/* Disponibilité. Sans statusUrl, on annonce un délai de réponse plutôt qu'une
   présence : un point vert sur un outil de sécurité promet une disponibilité
   qu'un fichier local ne peut pas garantir. */
const ETATS={
  ligne:{c:"--r0",t:"En ligne"},
  recent:{c:"--r2",t:"Connecté récemment"},
  hors:{c:"--r4",t:"Hors ligne"}
};
function showDot(c,t){ const d=$("dot"); if(d) d.innerHTML=`<i style="background:var(${c})"></i><span>${t}</span>`; }
function setDot(){
  if(!CONTACT.statusUrl){ showDot("--line-2",`Réponse sous ${CONTACT.delai}`); return; }
  showDot("--line-2","Vérification…");
  fetch(CONTACT.statusUrl,{cache:"no-store"})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(j=>{ const e=ETATS[j&&j.etat]; e?showDot(e.c,e.t):showDot("--line-2",`Réponse sous ${CONTACT.delai}`); })
    .catch(()=>showDot("--line-2",`Réponse sous ${CONTACT.delai}`));
}

        `Niveau global : ${max}/4 — ${SCALE[max].n}`,

    $("incident").onclick=()=>goIncident(resume());
    $("copy").onclick=()=>{
      const max=Math.max(...S.scores);

        `Examen : ${HYP.exams[S.ex].n} · ${POS[S.pos]}, ${ENT[S.ent].toLowerCase()}`,
        `Patient : ${S.h} cm`,
        `Dispositif : ${HYP.land[S.imp].n}, ${HYP.lat[S.lat].n.toLowerCase()} — ${Math.round(Math.abs(bOf(S.imp)))} cm de l'isocentre`,"",
        `NIVEAU GLOBAL : ${max}/4 — ${SCALE[max].n}`,
        ...FIELDS.map((f,i)=>`  ${f.k} : ${S.scores[i]}/4 — ${SCALE[S.scores[i]].n}`),"",
        "MESURES D'ATTÉNUATION",
        ...(S.mitig.length?dedupe(S.mitig).map(m=>`  · ${m[0]} : ${m[1]}`):["  aucune"]),"",
        "TRAJET",...S.trace.map(x=>`  ${x[0].replace(/\s*\?$/,"")} — ${x[1]}`),"",
        "Analyse structurée à titre documentaire. Ne constitue pas une décision médicale.",
        "Décision finale : médecin radiologue responsable de l'IRM."].join("\n");
      navigator.clipboard.writeText(t).then(()=>{
        $("copy").textContent="Copié"; setTimeout(()=>$("copy").textContent="Copier pour le dossier",1800);
      }).catch(()=>{ $("copy").textContent="Copie impossible"; });
    };
  },
  ready:()=>true
};

function drawSources(){

    return `<tr><td>${c}</td><td>${s}</td><td><span class="st" style="color:var(${col});border-color:var(${col})">${n}</span></td></tr>`;}).join("")}

function go(n){
  while(STEPS[n]&&STEPS[n].skip&&STEPS[n].skip()) n++;
  VIEW="expert";
  S.step=n;
  $("main").innerHTML=STEPS[n].render();
  drawFields();
  drawSources();
  STEPS[n].bind&&STEPS[n].bind();
  const nx=$("next");
  if(nx){
    nx.disabled=!STEPS[n].ready();
    nx.onclick=()=>{
      STEPS[n].done&&STEPS[n].done();
      if(STEPS[n].score) STEPS[n].score().forEach(r=>{ S.scores[r.i]=r.s; S.detail[r.i]=r.w; });
      if(n===2&&S.label==="safe"){
        S.scores=[0,0,0,0];
        S.detail=[0,1,2,3].map(()=>["Étiquetage MR Safe vérifié."]);
        S.mitig.push(["Documentation","Consigner la vérification de l'étiquetage MR Safe dans le dossier du patient."]);
        return go(9);
      }
      if(n===2&&S.label==="unsafe"){
        S.scores=[4,4,4,4];
        S.detail=[0,1,2,3].map(()=>["Étiquetage MR Unsafe : dispositif explicitement contre-indiqué en environnement IRM."]);
        S.mitig.push(["Documentation","Consigner l'étiquetage MR Unsafe et la décision du médecin radiologue responsable de l'IRM dans le dossier du patient."]);
        return go(9);
      }
      go(n+1);
    };
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
function startExpert(){ reset(); go(0); }

function QU(key,label,hint,opts){

/* Orientation. Tiers 0=favorable · 2=prudent · 3=stop (1 n'est pas utilisé :
   pas de niveau intermédiaire favorable/prudent en mode urgence). */
function uStopReason(){
  if(U.compat==="non_compatible") return "incompatible";
  if(U.loc==="oeil") return "oeil";
  if(U.ident==="inconnu"&&U.prox==="oui") return "inconnu_proximal";
  if(U.mobile==="recent"&&["oeil","vaisseau","nerf"].includes(U.loc)) return "migration";
  return null;
}
function uTier(){
  if(uStopReason()) return 3;
  if(U.compat!=="conditionnel_precis") return 2;
  if(U.ident!=="connu_doc") return 2;
  if(U.prox!=="non") return 2;
  if(U.taille==="inconnue"||U.nature==="inconnue") return 2;
  if(U.loc==="vaisseau"||U.loc==="nerf") return 2;
  return 0;
}
/* Mécanisme dominant — heuristique de secours, sans mesure de longueur
   résonante ni de trajet précis : ce que l'analyse complète établit par
   le calcul, ce mode le déduit de ce qui est observable en quelques
   minutes. */
function uMecanismes(){
  const m=new Set();
  if(U.loc==="oeil"){ m.add("couple"); m.add("translation"); }
  if(U.loc==="vaisseau") m.add("b1");
  if(U.loc==="nerf"){ m.add("dbdt"); m.add("b1"); }
  if(U.nature==="passif"){ m.add("couple"); m.add("translation"); }
  if(U.nature==="actif"){
    if(U.prox==="oui"||U.prox==="incertain"){ m.add("b1"); m.add("dbdt"); }
    else { m.add("couple"); m.add("translation"); }
  }
  if(U.nature==="inconnue"||m.size===0){ m.add("couple"); m.add("translation"); m.add("dbdt"); m.add("b1"); }
  return m;
}
const U_CONSEILS={
  couple:["Faites entrer le patient <strong>lentement</strong> dans le tunnel : c'est le passage à travers les lignes de champ, pas la position finale, qui provoque l'à-coup de couple sur un élément ferromagnétique.",
    "Si un champ plus faible est disponible (1,5 T plutôt que 3 T), le couple en dépend directement.",
    "Si l'élément est externe (bijou, piercing, dispositif amovible), sécurisez-le mécaniquement avant l'entrée — impossible pour un implant interne."],
  translation:["Visez à positionner le dispositif le plus près possible de <strong>l'isocentre</strong> du tunnel : le gradient spatial y est quasi nul.",
    "Ralentissez la vitesse de déplacement de la table, surtout à l'approche du tunnel — la force dépend du produit vitesse × gradient local."],
  dbdt:["Si le protocole le permet, privilégiez des séquences avec des <strong>gradients moins intenses</strong> (dB/dt plus faible).",
    "Maintenez un contact avec le patient s'il peut communiquer, pour repérer une stimulation nerveuse (picotement, contraction)."],
  b1:["Un champ plus faible réduit généralement l'échauffement RF — <strong>sauf</strong> si la nouvelle longueur d'onde se rapproche de la longueur du conducteur, auquel cas l'effet peut s'inverser (non monotone).",
    "Une compresse froide au contact du trajet du conducteur, si accessible, limite l'élévation locale de température.",
    "Réduisez le SAR au maximum permis par le protocole.",
    "Maintenez un contact avec le patient pour repérer une sensation de chaleur."]
};
const U_MECN={couple:"Couple (B0)",translation:"Translation (dB/dx)",dbdt:"Neurostimulation (dB/dt)",b1:"Échauffement (B1)"};

/* Détail du palier "stop" : à quoi tient la contre-indication, et ce qui
   serait à faire si le médecin radiologue responsable décidait malgré tout
   de maintenir l'examen. Adossé à la raison précise du stop (uStopReason),
   pas à une heuristique générique — le contenu doit rester exact sur ce
   palier, celui où l'erreur coûte le plus cher. */
const U_STOP={
  incompatible:{
    risques:[{n:"majeur",t:"Le dispositif est explicitement étiqueté incompatible IRM par le fabricant. Le ou les mécanismes précis (couple, échauffement, dysfonctionnement électronique du dispositif) ne sont pas toujours détaillés publiquement, mais cet étiquetage prime sur toute estimation faite par cet outil."}],
    mesures:["Rechercher la documentation constructeur ou une base de données d'implants pour identifier le mécanisme précis de l'incompatibilité, si le délai clinique le permet.",
      "Évaluer une imagerie alternative (CT, échographie) si cliniquement pertinente.",
      "Si l'IRM reste jugée indispensable malgré l'étiquetage, la décision et sa justification doivent être documentées explicitement par le médecin radiologue responsable, idéalement avec un avis d'expert en sécurité IRM."]
  },
  oeil:{
    risques:[{n:"majeur",t:"Couple (B0) : un élément ferromagnétique dans ou près de l'œil peut subir une rotation brutale dès l'entrée dans le tunnel, avec risque de lésion oculaire directe."},
      {n:"majeur",t:"Translation (dB/dx) : la force de déplacement peut projeter l'élément à travers les tissus oculaires, y compris hors de la zone visée par l'examen prescrit."}],
    mesures:["Ne pas installer le patient dans l'aimant sans confirmation formelle de la nature non ferromagnétique de l'élément (radiographie orbitaire de dépistage si disponible et compatible avec le délai clinique).",
      "Alerter immédiatement le médecin radiologue responsable — l'œil est une zone à tolérance quasi nulle, quel que soit l'examen demandé."]
  },
  inconnu_proximal:{
    risques:[{n:"majeur",t:"Nature du dispositif totalement inconnue (ferromagnétisme, conductivité, dimensions) alors qu'il se trouve dans ou à proximité immédiate de la zone examinée — les quatre mécanismes (B0, dB/dx, dB/dt, B1) sont donc tous potentiellement engagés."}],
    mesures:["Rechercher activement toute documentation disponible (dossier, imagerie antérieure, entourage du patient) avant de poursuivre.",
      "Si l'identification reste impossible, discuter avec le médecin radiologue responsable du rapport bénéfice/risque et des alternatives d'imagerie."]
  },
  migration:{
    risques:[{n:"élevé",t:"Le caractère récent du corps étranger n'exclut pas une migration en cours ; sa position actuelle par rapport à une structure vitale (œil, vaisseau, nerf) a pu évoluer depuis la dernière imagerie."},
      {n:"élevé",t:"Translation (dB/dx) : une force de déplacement, même modeste, peut suffire à léser une structure vitale si le corps étranger est encore mobile."}],
    mesures:["Obtenir une imagerie de repérage récente (radiographie) si le délai clinique le permet, pour confirmer la position actuelle avant toute décision.",
      "Discuter avec le médecin radiologue responsable du délai depuis le traumatisme et de la probabilité de migration résiduelle."]
  }
};

function uResume(){
  const tier=uTier();
  return [
    "MODE URGENCE — orientation "+({0:"favorable",2:"prudent",3:"stop"}[tier]),
    `Identification : ${{connu_doc:"connu, documenté",connu_nodoc:"connu, sans documentation",inconnu:"non identifié"}[U.ident]}`,
    U.compat?`Compatibilité : ${{conditionnel_precis:"conditionnelle précise",conditionnel_flou:"conditionnelle imprécise",non_compatible:"non compatible",pas_doc:"sans documentation"}[U.compat]}`:"",
    `Nature : ${{actif:"actif",passif:"passif",inconnue:"inconnue"}[U.nature]}`,
    `Localisation : ${U_LOC[U.loc]}`,
    U.taille?`Taille : ${{petit:"< 1 cm",moyen:"1-5 cm",grand:"> 5 cm",inconnue:"inconnue"}[U.taille]}`:"",
    `Proximité de la zone examinée : ${{oui:"oui",non:"non",incertain:"incertaine"}[U.prox]}`,
    `Ancienneté : ${{ancien:"ancien / fixe",recent:"récent / potentiellement mobile",inconnu:"inconnue"}[U.mobile]}`
  ].filter(Boolean).join("\n");
}

USTEPS[7]={
  render(){
    const tier=uTier();
    const cfg={
      0:{c:"--r0",bg:"--r0bg",t:"Éléments a priori rassurants",
         b:"Procéder selon le protocole standard. Garder le contact patient actif (poire d'alarme), signaler tout inconfort immédiatement."},
      2:{c:"--r2",bg:"--r2bg",t:"Informations insuffisantes pour trancher seul·e",
         b:"Contacter le médecin radiologue responsable avant de démarrer l'examen."},
      3:{c:"--r4",bg:"--r4bg",t:"Matériel contre-indiqué ou dispositif non maîtrisé",
         b:"Ne pas installer le patient dans l'aimant. Appeler le médecin radiologue responsable immédiatement."}
    }[tier];
    const mecs=[...uMecanismes()];
    const manque=[];
    if(U.ident!=="connu_doc") manque.push("documentation ou carte du dispositif");
    if(U.compat&&U.compat!=="conditionnel_precis") manque.push("conditions IRM précises (champ, antenne, SAR)");
    if(U.taille==="inconnue") manque.push("taille du matériel");
    if(U.prox==="incertain") manque.push("distance exacte à la zone examinée");
    return `<h2>Orientation</h2>
    <div class="sub">Ceci est une orientation, pas une décision. Le go/no-go de l'examen revient au médecin radiologue responsable de l'IRM.</div>
    <div class="verdict" style="background:var(${cfg.bg});border-color:var(${cfg.c})">
      <div class="verdict-t" style="color:var(${cfg.c})">${cfg.t}</div>
      <div class="verdict-b" style="color:var(${cfg.c})">${cfg.b}</div></div>
    ${tier===2&&manque.length?`<div class="note"><strong>À rassembler si possible avant d'appeler :</strong> ${manque.join(", ")}.</div>`:""}
    ${tier===3?(()=>{ const si=U_STOP[uStopReason()]; return si?`
    <div class="eyebrow">Ce que cette contre-indication implique</div>
    ${si.risques.map(r=>`<div class="mit"><div class="mit-k">Risque ${r.n}</div><div class="mit-b">${r.t}</div></div>`).join("")}
    <div class="eyebrow">Si l'examen doit malgré tout être réalisé</div>
    <div class="note">Décision qui relève exclusivement du médecin radiologue responsable de l'IRM, avec documentation explicite de la justification et du bénéfice attendu.</div>
    ${si.mesures.map(m=>`<div class="mit"><div class="mit-b">${m}</div></div>`).join("")}`:"";})():
    `<div class="eyebrow">Si l'examen est réalisé</div>
      ${mecs.map(m=>`<div class="mit"><div class="mit-k">${U_MECN[m]}</div>
        <div class="mit-b">${U_CONSEILS[m].join(" ")}</div></div>`).join("")}`}
    <div class="actions">
      <button class="act" id="uincident">Déclarer un incident</button>
      <button class="gh" id="ufull">Passer en analyse complète</button>
      <button class="gh" id="urestart">Nouvelle analyse urgence</button>
      <button class="gh" id="uhome">Accueil</button>
    </div>`;
  },
  bind(){
    $("uincident").onclick=()=>goIncident(uResume());
    $("ufull").onclick=()=>startExpert();
    $("urestart").onclick=()=>{ resetU(); goU(0); };
    $("uhome").onclick=goHome;
  },
  ready:()=>true
};

function goU(n){
  while(USTEPS[n]&&USTEPS[n].skip&&USTEPS[n].skip()) n++;
  VIEW="urgence"; U.step=n;
  $("fields").innerHTML=""; $("srcs").innerHTML="";
  $("main").innerHTML=USTEPS[n].render();
  USTEPS[n].bind&&USTEPS[n].bind();
  const nx=$("unext");
  if(nx){ nx.disabled=!USTEPS[n].ready(); nx.onclick=()=>goU(n+1); }
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ══════════════════════════════════════════════════════════════
   DÉCLARER UN INCIDENT
   Aucune donnée n'est collectée ni conservée ici : l'outil prépare un
   résumé à coller dans le registre officiel de l'ASTRM, qui reste le
   seul récepteur des déclarations. Pas de doublon, pas de responsable
   de traitement supplémentaire.
   ══════════════════════════════════════════════════════════════ */
const ASTRM_URL="https://svmtr-astrm.limesurvey.net/365595?lang=fr&newtest=Y";
function goIncident(prefill){
  VIEW="incident"; $("fields").innerHTML=""; $("srcs").innerHTML="";
  const txt=prefill||"Aucune analyse récente disponible dans cette session — décrivez le contexte directement dans le formulaire ASTRM.";
  $("main").innerHTML=`<h2>Déclarer un incident</h2>
  <div class="sub">Le registre officiel des incidents IRM en Suisse est tenu par l'ASTRM. Cet outil ne collecte ni ne conserve aucune donnée d'incident : il prépare un résumé à coller dans leur formulaire, que vous complétez et envoyez vous-même.</div>
  <div class="panel"><div class="panel-h"><div class="panel-t">Résumé à copier</div></div>
    <div class="dbody" style="padding:14px"><pre style="white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--ink-2)">${txt.replace(/</g,"&lt;")}</pre></div></div>
  <div class="actions">
    <button class="act" id="icopy">Copier le résumé</button>
    <button class="gh" id="iopen">Ouvrir le formulaire ASTRM ↗</button>
  </div>
  <div class="note" style="margin-top:18px"><strong>Définitions du formulaire ASTRM</strong> — incident : événement fortuit qui aurait pu provoquer des dommages. Near miss : incident qui a failli de très peu provoquer un accident. Événement indésirable grave : entraîne la mort, met en danger la vie de la personne, nécessite une hospitalisation ou sa prolongation, provoque une incapacité ou un handicap important et durable, ou se traduit par une anomalie ou une malformation congénitale.</div>
  <div class="actions"><button class="gh" id="uhome">Accueil</button></div>`;
  $("icopy").onclick=()=>{
    navigator.clipboard.writeText(txt).then(()=>{
      $("icopy").textContent="Résumé copié"; setTimeout(()=>$("icopy").textContent="Copier le résumé",1800);
    }).catch(()=>{ $("icopy").textContent="Copie impossible"; });
  };
  $("iopen").onclick=()=>window.open(ASTRM_URL,"_blank","noopener");
  $("uhome").onclick=goHome;
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ══════════════════════════════════════════════════════════════
   FORMATION & CONSULTING
   Page vitrine + formulaire, envoyé par mailto (pas de backend).
   ══════════════════════════════════════════════════════════════ */
function goFormation(){
  VIEW="formation"; $("fields").innerHTML=""; $("srcs").innerHTML="";
  $("main").innerHTML=`<h2>Formation &amp; consulting</h2>
  <div class="sub">Formation en sécurité IRM — présentielle, en ligne, ou conseil/audit sur site pour un service ou une équipe. Public de 1 à plus de 450 personnes, en français et en anglais.</div>
  <div class="note">Plus de six ans d'expérience en formation, plus de 1000 personnes formées toutes professions confondues, intervention en congrès. Dispensée par un expert en sécurité IRM (${CONTACT.titre}).</div>
  <div class="ctrl">
    <div class="f"><label for="fnom">Votre nom</label><input type="text" id="fnom" placeholder="Nom, prénom"></div>
    <div class="f"><label for="fent">Entreprise / institution</label><input type="text" id="fent" placeholder="Nom de l'établissement"></div>
    <div class="f"><label for="fadr">Adresse de l'entreprise</label><input type="text" id="fadr" placeholder="Adresse"></div>
    <div class="f"><label for="ffmt">Format souhaité</label>
      <select id="ffmt"><option value="presentiel">Présentielle</option><option value="ligne">En ligne</option><option value="conseil">Conseil / audit sur site</option></select></div>
    <div class="f"><label for="fpub">Public cible</label>
      <select id="fpub"><option value="trm">TRM</option><option value="medecins">Médecins radiologues</option>
      <option value="secretaires">Secrétaires médicales</option><option value="agents">Agents de nettoyage</option>
      <option value="autre">Autre</option></select></div>
  </div>
  <div class="q"><div class="q-l">Votre besoin</div>
    <div class="q-h">Précisez le contenu souhaité, la durée envisagée, le temps dont vous disposez, et sur combien de jours.</div>
    <textarea id="fbesoin" rows="5" style="width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius-xs);padding:9px 10px"></textarea></div>
  <div class="actions">
    <button class="act" id="fsend">Envoyer la demande</button>
    <button class="gh" id="uhome">Accueil</button>
  </div>
  <div class="note" style="margin-top:14px">Un devis vous sera adressé après réception de votre demande.</div>`;
  $("fsend").onclick=()=>{
    if(!CONTACT.email){ alert("Aucune adresse de contact n'est configurée dans ce fichier pour le moment."); return; }
    const fmt={presentiel:"Présentielle",ligne:"En ligne",conseil:"Conseil / audit sur site"}[$("ffmt").value];
    const pub={trm:"TRM",medecins:"Médecins radiologues",secretaires:"Secrétaires médicales",agents:"Agents de nettoyage",autre:"Autre"}[$("fpub").value];
    const body=[
      `Nom : ${$("fnom").value}`,`Entreprise : ${$("fent").value}`,`Adresse : ${$("fadr").value}`,
      `Format souhaité : ${fmt}`,`Public cible : ${pub}`,"","Besoin :",$("fbesoin").value
    ].join("\n");
    window.location.href=`mailto:${CONTACT.email}?subject=${encodeURIComponent("Demande de formation / consulting — sécurité IRM")}&body=${encodeURIComponent(body)}`;
  };
  $("uhome").onclick=goHome;
  window.scrollTo({top:0,behavior:"smooth"});
}

$("home-link").onclick=e=>{ e.preventDefault(); goHome(); };

/* Légère animation d'entrée à chaque changement d'écran (désactivée si "réduire les animations" est actif — voir CSS). */
(function(){
  const mainEl=$("main");
  const mo=new MutationObserver(()=>{
    mainEl.classList.remove("enter");
    void mainEl.offsetWidth; /* force reflow pour rejouer l'animation */
    mainEl.classList.add("enter");
  });
  mo.observe(mainEl,{childList:true});
})();

goHome();
</script>
</body>
</html>
