      <div class="eyebrow">${titre1}</div>${d.risques.map(t=>`<div class="mit"><div class="mit-b">${t}</div></div>`).join("")}
      <div class="eyebrow">${titre2}</div>${d.mesures.map(t=>`<div class="mit"><div class="mit-b">${t}</div></div>`).join("")}`; };
    const now=new Date();
    return `<div class="printonly"><div class="pr-h">MR-SafeTic — orientation mode urgence</div>
      <div class="pr-d">${now.toLocaleDateString("fr-CH")} à ${now.toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit"})} · outil d'aide à la décision, ne remplace pas l'avis médical</div>
      <pre class="pr-r">${uResume().replace(/</g,"&lt;")}</pre></div>
    <h2>Orientation</h2>
    <div class="sub">Ceci est une orientation, pas une décision. Le <em>« go/no-go »</em> de l'examen revient au médecin radiologue responsable de l'IRM.</div>
    <div class="verdict" style="background:var(${cfg.bg});border-color:var(${cfg.c})">
      <div class="verdict-t" style="color:var(${cfg.c})">${cfg.t}</div>
      <div class="verdict-b" style="color:var(${cfg.c})">${cfg.b}</div></div>
    ${M3?motifBlock(M3,"Pourquoi","Ce qui permettrait de reconsidérer l'examen")+`
    <div class="note">Si l'examen devait malgré tout être réalisé, la décision relève exclusivement du médecin radiologue responsable de l'IRM, avec documentation explicite de la justification et du bénéfice attendu.</div>`:`
    ${M2.map(x=>motifBlock(x,"À faire valider","Avant l'examen")).join("")}
    ${sar?`<div class="eyebrow">Condition d'examen</div><div class="mit"><div class="mit-k">SAR</div><div class="mit-b">${sar}${["coronaire","valve"].includes(U.struct)?" Pas de contrainte de gradient spatial ; 15 minutes maximum par séquence, plusieurs séquences possibles.":""}</div></div>`:""}
    ${U.nature==="actif"?`<div class="eyebrow">Implant actif — avant l'examen</div>
    ${uActifSteps().map(t=>`<div class="mit"><div class="mit-b">${t}</div></div>`).join("")}`:""}
    <div class="eyebrow">Énergie par énergie</div>
    <div class="uen">${E.length&&E.every(e=>e.why===E[0].why&&e.lv===E[0].lv)?`<div class="uen-r">
      <div class="uen-h"><span class="uen-k">B0 · dB/dx · dB/dt · B1</span><span class="uen-n">Les quatre énergies</span>
        <span class="uen-lv" style="color:var(${U_LV[E[0].lv].c});background:var(${U_LV[E[0].lv].bg});border-color:var(${U_LV[E[0].lv].c})">${U_LV[E[0].lv].n}</span></div>
      <div class="uen-b">${E[0].why}</div></div>`:E.map(e=>`<div class="uen-r">
      <div class="uen-h"><span class="uen-k">${e.k}</span><span class="uen-n">${e.n}</span>
        <span class="uen-lv" style="color:var(${U_LV[e.lv].c});background:var(${U_LV[e.lv].bg});border-color:var(${U_LV[e.lv].c})">${U_LV[e.lv].n}${e.info?" · info":""}</span></div>
      <div class="uen-b">${e.why}</div></div>`).join("")}</div>
    ${U.pt?`<div class="note">Position retenue : ${cm(g.z)} cm de l'isocentre le long du tunnel, ${sideTxt(g.x)}, ${apTxt(g.y)}. ${g.fil?` Fil ou sonde désigné par un seul point : trajet estimé à ±${FIL_SPAN} cm au-dessus et en dessous, sans sortir de la région anatomique désignée ; le pire point est retenu.`:""} ${POS[U.pos]}, aimant ${MAG[U.B]}, ${COIL[U.coil].toLowerCase()} en émission.</div>`:`<div class="note">${POS[U.pos]}, aimant ${MAG[U.B]}, ${COIL[U.coil].toLowerCase()} en émission.</div>`}
    ${conseils.length?`<div class="eyebrow">Précautions${tier===2?" si l'examen est maintenu":""}</div>
    ${conseils.map(c=>`<div class="mit"><div class="mit-k">${{couple:"Couple (B0)",translation:"Translation (dB/dx)",dbdt:"Stimulation (dB/dt)",b1:"Échauffement (B1)"}[c]}</div><div class="mit-b">${U_CONSEILS[c].join(" ")}</div></div>`).join("")}`:""}`}
    ${tier>=1&&manque.length?`<div class="note"><strong>Ce qui affinerait l'orientation :</strong> ${manque.join(", ")}.</div>`:""}
    <div class="actions">
      <button class="gh" id="uprev">Modifier les réponses</button>
      <button class="gh" id="uincident">Déclarer un incident</button>
      <button class="gh" id="ufull">Passer en analyse complète</button>
      <button class="gh" id="urestart">Nouvelle analyse urgence</button>
      <button class="gh" id="uhome">Accueil</button>
      <button class="act" id="uprint">Imprimer la fiche / PDF</button></div>`;
  },
  bind(){
    $("uincident").onclick=()=>goIncident(uResume());
    $("uprint").onclick=()=>window.print();
    $("uprev").onclick=()=>goUBack(U.step);
    $("ufull").onclick=()=>startExpert(U);
    $("urestart").onclick=()=>{ resetU(); goU(0); };
    $("uhome").onclick=goHome;
  },
  ready:()=>true
};

function goU(n){
  /* une question sautée ne doit pas laisser derrière elle une ancienne réponse */
  if(U.struct&&!uStructOpts().some(o=>o.v===U.struct)) U.struct=null;   // la région ou la nature a changé
  USTEPS.forEach(s=>{ if(s.key&&s.skip&&s.skip()) U[s.key]=null; });
  while(USTEPS[n]&&USTEPS[n].skip&&USTEPS[n].skip()) n++;
  VIEW="urgence"; U.step=n;
  $("fields").innerHTML=""; $("srcs").innerHTML="";
  $("main").innerHTML=USTEPS[n].render();
  USTEPS[n].bind&&USTEPS[n].bind();
  const nx=$("unext");
  if(nx){ nx.disabled=!USTEPS[n].ready(); nx.onclick=()=>goU(n+1); }
  window.scrollTo({top:0,behavior:"smooth"});
}
function goUBack(n){
  n--; while(n>0&&USTEPS[n].skip&&USTEPS[n].skip()) n--;
  goU(Math.max(0,n));
}

/* ══════════════════════════════════════════════════════════════
   DÉCLARER UN INCIDENT
   Aucune donnée n'est collectée ni conservée ici : l'outil prépare un
   résumé à coller dans le registre officiel de l'ASTRM, qui reste le
   seul récepteur des déclarations. Pas de doublon, pas de responsable
   de traitement supplémentaire.
   ══════════════════════════════════════════════════════════════ */
const ASTRM_URL="https://svmtr-astrm.limesurvey.net/365595?lang=fr&newtest=Y";
function goIncident(prefill){
  VIEW="incident"; $("fields").innerHTML=""; $("srcs").innerHTML="";
  const txt=prefill||"Aucune analyse récente disponible dans cette session — décrivez le contexte directement dans le formulaire ASTRM.";
  $("main").innerHTML=`<h2>Déclarer un incident</h2>
  <div class="sub">Le registre officiel des incidents IRM en Suisse est tenu par l'ASTRM. Cet outil ne collecte ni ne conserve aucune donnée d'incident : il prépare un résumé à coller dans leur formulaire, que vous complétez et envoyez vous-même.</div>
  <div class="panel"><div class="panel-h"><div class="panel-t">Résumé à copier</div></div>
    <div class="dbody" style="padding:14px"><pre style="white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--ink-2)">${txt.replace(/</g,"&lt;")}</pre></div></div>
  <div class="actions">
    <button class="gh" id="iopen">Ouvrir le formulaire ASTRM ↗</button>
      <button class="act" id="icopy">Copier le résumé</button></div>
  <div class="note" style="margin-top:18px"><strong>Définitions du formulaire ASTRM</strong> — incident : événement fortuit qui aurait pu provoquer des dommages. Near miss : incident qui a failli de très peu provoquer un accident. Événement indésirable grave : entraîne la mort, met en danger la vie de la personne, nécessite une hospitalisation ou sa prolongation, provoque une incapacité ou un handicap important et durable, ou se traduit par une anomalie ou une malformation congénitale.</div>
  <div class="actions"><button class="gh" id="uhome">Accueil</button></div>`;
  $("icopy").onclick=()=>{
    navigator.clipboard.writeText(txt).then(()=>{
      $("icopy").textContent="Résumé copié"; setTimeout(()=>$("icopy").textContent="Copier le résumé",1800);
    }).catch(()=>{ $("icopy").textContent="Copie impossible"; });
  };
  $("iopen").onclick=()=>window.open(ASTRM_URL,"_blank","noopener");
  $("uhome").onclick=goHome;
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ══════════════════════════════════════════════════════════════
   FORMATION & CONSULTING
   Page vitrine + formulaire, envoyé par mailto (pas de backend).
   ══════════════════════════════════════════════════════════════ */
function goFormation(){
  VIEW="formation"; $("fields").innerHTML=""; $("srcs").innerHTML="";
  $("main").innerHTML=`<h2>Formation &amp; consulting</h2>
  <div class="sub">Formation en sécurité IRM — présentielle, en ligne, ou conseil/audit sur site pour un service ou une équipe. Public de 1 à plus de 450 personnes, en français et en anglais.</div>
  <div class="note">Plus de six ans d'expérience en formation, plus de 1000 personnes formées toutes professions confondues, intervention en congrès. Dispensée par un expert en sécurité IRM (${CONTACT.titre}).</div>
  <div class="ctrl">
    <div class="f"><label for="fnom">Votre nom</label><input type="text" id="fnom" placeholder="Nom, prénom"></div>
    <div class="f"><label for="fent">Entreprise / institution</label><input type="text" id="fent" placeholder="Nom de l'établissement"></div>
    <div class="f"><label for="fadr">Adresse de l'entreprise</label><input type="text" id="fadr" placeholder="Adresse"></div>
    <div class="f"><label for="ffmt">Format souhaité</label>
      <select id="ffmt"><option value="presentiel">Présentielle</option><option value="ligne">En ligne</option><option value="conseil">Conseil / audit sur site</option></select></div>
    <div class="f"><label for="fpub">Public cible</label>
      <select id="fpub"><option value="trm">TRM</option><option value="medecins">Médecins radiologues</option>
      <option value="secretaires">Secrétaires médicales</option><option value="agents">Agents de nettoyage</option>
      <option value="autre">Autre</option></select></div>
  </div>
  <div class="q"><div class="q-l">Votre besoin</div>
    <div class="q-h">Précisez le contenu souhaité, la durée envisagée, le temps dont vous disposez, et sur combien de jours.</div>
    <textarea id="fbesoin" rows="5" style="width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius-xs);padding:9px 10px"></textarea></div>
  <div class="actions">
    <button class="gh" id="uhome">Accueil</button>
      <button class="act" id="fsend">Envoyer la demande</button></div>
  <div class="note" style="margin-top:14px">Un devis vous sera adressé après réception de votre demande.</div>`;
  $("fsend").onclick=()=>{
    if(!CONTACT.email){ alert("Aucune adresse de contact n'est configurée dans ce fichier pour le moment."); return; }
    const fmt={presentiel:"Présentielle",ligne:"En ligne",conseil:"Conseil / audit sur site"}[$("ffmt").value];
    const pub={trm:"TRM",medecins:"Médecins radiologues",secretaires:"Secrétaires médicales",agents:"Agents de nettoyage",autre:"Autre"}[$("fpub").value];
    const body=[
      `Nom : ${$("fnom").value}`,`Entreprise : ${$("fent").value}`,`Adresse : ${$("fadr").value}`,
      `Format souhaité : ${fmt}`,`Public cible : ${pub}`,"","Besoin :",$("fbesoin").value
    ].join("\n");
    window.location.href=`mailto:${CONTACT.email}?subject=${encodeURIComponent("Demande de formation / consulting — sécurité IRM")}&body=${encodeURIComponent(body)}`;
  };
  $("uhome").onclick=goHome;
  window.scrollTo({top:0,behavior:"smooth"});
}

$("home-link").onclick=e=>{ e.preventDefault(); goHome(); };

/* Légère animation d'entrée à chaque changement d'écran (désactivée si "réduire les animations" est actif — voir CSS). */
(function(){
  const mainEl=$("main");
  const mo=new MutationObserver(()=>{
    mainEl.classList.remove("enter");
    void mainEl.offsetWidth; /* force reflow pour rejouer l'animation */
    mainEl.classList.add("enter");
  });
  mo.observe(mainEl,{childList:true});
})();

goHome();
</script>
</body>
