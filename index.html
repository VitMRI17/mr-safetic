<title>MR-SafeTic — sécurité IRM, analyse de risque implant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#EDEFF1; --ink-2:#AEB6BD; --ink-3:#7C868E;
  --paper:#0B0E11; --card:#171C21; --line:#2A3138; --line-2:#3A434C;
  --r0:#4FBF95; --r1:#DFC047; --r2:#EF9A4E; --r3:#E07248; --r4:#E06666;
  --r0bg:#12261F; --r1bg:#2A2412; --r2bg:#2C1F12; --r3bg:#2C1A12; --r4bg:#2C1414;
  --bore:#1D242A; --skin:#39424A;
  --sans:'Inter',system-ui,sans-serif;
  --cond:'Space Grotesk','Inter',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:12px; --radius-s:8px; --radius-xs:5px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.34);
  --shadow-md:0 2px 6px rgba(0,0,0,.34),0 12px 28px rgba(0,0,0,.42);
  --ease:cubic-bezier(.2,.7,.3,1);
  --accent:#6E93FF; --accent-2:#8FABFF; --accent-bg:#152244;
  --cat-urgence:#E89A5C; --cat-expert:#6E93FF; --cat-incident:#E2708A; --cat-formation:#4FC2AA;
  --mesh-1:rgba(110,147,255,.26); --mesh-2:rgba(232,154,92,.22); --mesh-3:rgba(79,194,170,.20); --mesh-4:rgba(226,112,138,.18);
  color-scheme:dark;
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-15vh -15vw;z-index:-1;pointer-events:none;
  background:
    radial-gradient(52vw 52vw at 4% -8%, var(--mesh-1), transparent 65%),
    radial-gradient(46vw 46vw at 104% 4%, var(--mesh-2), transparent 62%),
    radial-gradient(48vw 48vw at -8% 98%, var(--mesh-3), transparent 62%),
    radial-gradient(44vw 44vw at 102% 106%, var(--mesh-4), transparent 60%);
  filter:blur(18px);
  animation:meshDrift 28s var(--ease) infinite alternate}
@keyframes meshDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-2.5%,2.5%) scale(1.06)}}
.shell{max-width:800px;margin:0 auto;padding:0 20px 80px;position:relative}

header{border-bottom:1px solid var(--line);padding:22px 0 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.accent-bar{height:3px;background:linear-gradient(90deg,var(--cat-urgence),var(--cat-expert) 45%,var(--cat-formation))}
.brand{font-family:var(--cond);font-weight:600;font-size:23px;line-height:1.15}
.brand-wrap{display:flex;align-items:center;gap:14px;min-width:0}
.brand-logo{width:48px;height:48px;flex:none}
@media(max-width:560px){.brand-logo{width:40px;height:40px}}
.brand span{display:block;font-family:var(--mono);font-weight:400;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.ver{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;padding-top:4px;white-space:nowrap}

.fields{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-top:none;background:var(--card);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.fld{padding:11px 10px 12px;border-right:1px solid var(--line);position:relative}
.fld:last-child{border-right:none}
.fld-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
.fld-n{font-family:var(--cond);font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.25}
.fld-s{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:7px;color:var(--line-2);font-variant-numeric:tabular-nums;line-height:1}
.fld-bar{height:3px;background:var(--line);margin-top:8px;overflow:hidden}
.fld-bar i{display:block;height:100%;width:0;background:var(--line-2);transition:width .3s ease,background .3s ease}
.fld[data-on="1"]::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--accent)}

.welcome{font-size:15.5px;color:var(--ink-2);line-height:1.62;max-width:62ch;margin-top:30px;padding-bottom:16px;border-bottom:1px solid var(--line)}
h2{font-family:var(--cond);font-size:27px;font-weight:600;margin:32px 0 6px;line-height:1.25}
.welcome+h2{margin-top:20px}
h2 em{font-family:var(--mono);font-style:normal;font-size:16px;font-weight:400;color:var(--ink-3)}
.sub{color:var(--ink-3);font-size:15px;margin-bottom:22px;max-width:64ch}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:28px 0 10px}

.q{margin:24px 0 0}
.q-l{font-size:16.5px;font-weight:500;line-height:1.45;margin-bottom:3px}
.q-h{font-size:14px;color:var(--ink-3);line-height:1.5;margin-bottom:11px;max-width:66ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{font-family:inherit;font-size:15.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-xs);
  padding:11px 14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:11px;line-height:1.4;
  transition:border-color .15s var(--ease),transform .15s var(--ease),box-shadow .15s var(--ease)}
.opts.row .opt{flex:1 1 auto;min-width:92px;justify-content:center;text-align:center}
.opt:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.opt:active{transform:translateY(0)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.opt.on{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.opts.row .opt.on{box-shadow:inset 0 -3px 0 var(--accent)}
.opt-t{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto;flex-shrink:0}

.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.f{background:var(--card);padding:11px 13px 12px}
.f label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
select,input[type=range],input[type=number]{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius-xs);padding:7px 8px;transition:border-color .15s var(--ease)}
select:hover,input:hover{border-color:var(--ink-3)}
select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent)}
.hval{font-family:var(--mono);font-size:13px;margin-top:3px}
.fh{font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:5px}

.panel{border:1px solid var(--line);background:var(--card);margin-top:14px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);gap:12px}
.panel-t{font-family:var(--cond);font-size:15px;font-weight:600}
.panel-s{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:right}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:10px;border:1px solid var(--line-2)}

.tabs{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-bottom:none;margin-top:22px;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
.tab{flex:1;background:var(--card);border:none;font-family:var(--cond);font-weight:600;font-size:13.5px;color:var(--ink-3);padding:11px 6px;cursor:pointer}
.tab.on{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}

.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.rc{background:var(--card);padding:13px 14px}
.rc-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rc-n{font-family:var(--cond);font-size:13.5px;font-weight:600;color:var(--ink-2);margin:2px 0 7px}
.rc-v{font-family:var(--cond);font-size:15px;font-weight:600;line-height:1.2}
.rc-w{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.45}

button.act{font-family:var(--cond);font-weight:600;font-size:16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-xs);padding:13px 23px;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease),opacity .15s,background .15s var(--ease)}
button.act:hover:not([disabled]){background:var(--accent-2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
button.act:active:not([disabled]){transform:translateY(0)}
button.act[disabled]{opacity:.32;cursor:not-allowed}
button.gh{background:none;color:var(--ink);border:1px solid var(--line-2);border-radius:var(--radius-xs);font-family:var(--sans);font-weight:500;font-size:15px;padding:11px 18px;cursor:pointer;transition:border-color .15s var(--ease),transform .15s var(--ease),background .15s var(--ease),color .15s var(--ease)}
button.gh:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
button.gh:active{transform:translateY(0)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}

.gate{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:24px;margin-top:28px}
.gate h3{font-family:var(--cond);font-size:17px;font-weight:600;margin-bottom:12px}
.gate p{font-size:13.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.62}
.gate ul{margin:0 0 14px 18px;font-size:13.5px;color:var(--ink-2)}
.gate li{margin-bottom:7px;line-height:1.55}
.chk{display:flex;gap:11px;align-items:flex-start;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.5}
.chk input{margin-top:3px;width:17px;height:17px;flex-shrink:0;accent-color:var(--accent)}

.verdict{border:1px solid;border-radius:var(--radius);box-shadow:var(--shadow-md);padding:20px 22px;margin:8px 0 18px}
.verdict-k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;opacity:.85}
.verdict-t{font-family:var(--cond);font-size:24px;font-weight:600;margin:5px 0 8px;line-height:1.2}
.verdict-b{font-size:14px;line-height:1.62;max-width:64ch}
.scale{display:flex;border:1px solid var(--line);border-radius:var(--radius-xs);overflow:hidden;margin-bottom:20px}
.scale div{flex:1;padding:7px 6px;font-family:var(--mono);font-size:10.5px;text-align:center;border-right:1px solid var(--line);line-height:1.3}
.scale div:last-child{border-right:none}
.mit{border-left:3px solid var(--ink);background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 var(--radius-xs) var(--radius-xs) 0;box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:9px}
.mit-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.mit-b{font-size:13.5px;line-height:1.55}
.expert{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px 22px;margin-top:22px}
.expert-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.expert-t{font-family:var(--cond);font-size:17px;font-weight:600}
.expert-s{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.expert-b{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-top:12px;max-width:64ch}
.expert-w{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:10px;max-width:64ch}
.expert-w strong{color:var(--ink-2)}
.dot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex-shrink:0}
.mono-sel{font-family:var(--mono);font-size:12px;color:var(--ink-2);user-select:all}
.help{margin-top:12px}
.syms{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0 14px}
.syms figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-xs);padding:14px 10px 12px;text-align:center}
.syms figure>div{color:var(--ink);line-height:0}
.syms figcaption{margin-top:9px;line-height:1.35}
.syms figcaption strong{display:block;font-family:var(--cond);font-size:13.5px;font-weight:600;color:var(--ink)}
.syms figcaption span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.help .dbody p{margin-bottom:9px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.cmpo{font-family:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xs);padding:14px 13px 11px;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;
  transition:border-color .15s var(--ease),transform .15s var(--ease),box-shadow .15s var(--ease)}
.cmpo::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--line-2);transition:background .15s var(--ease)}
.cmpo.cat-urgence::before{background:var(--cat-urgence)}
.cmpo.cat-expert::before{background:var(--cat-expert)}
.cmpo.cat-incident::before{background:var(--cat-incident)}
.cmpo.cat-formation::before{background:var(--cat-formation)}
.cmpo:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.cmpo:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cmpo.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.cmpo-n{font-size:14px;color:var(--ink);line-height:1.4}
.cmpo-l{font-family:var(--cond);font-weight:600;font-size:16.5px;line-height:1.25}
.cmpo-d{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.cmpo.cat-urgence .cmpo-d{color:var(--cat-urgence)}
.cmpo.cat-expert .cmpo-d{color:var(--cat-expert)}
.cmpo.cat-incident .cmpo-d{color:var(--cat-incident)}
.cmpo.cat-formation .cmpo-d{color:var(--cat-formation)}
.cmpo-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.cmpo-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cmpo-icon svg{width:17px;height:17px}
.cmpo.cat-urgence .cmpo-icon{background:color-mix(in srgb,var(--cat-urgence) 20%,var(--card));color:var(--cat-urgence)}
.cmpo.cat-expert .cmpo-icon{background:color-mix(in srgb,var(--cat-expert) 20%,var(--card));color:var(--cat-expert)}
.cmpo.cat-incident .cmpo-icon{background:color-mix(in srgb,var(--cat-incident) 20%,var(--card));color:var(--cat-incident)}
.cmpo.cat-formation .cmpo-icon{background:color-mix(in srgb,var(--cat-formation) 20%,var(--card));color:var(--cat-formation)}
#srcs{margin-top:36px}
.srct{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;margin-top:4px}
.dbody table.srct{font-family:var(--sans);font-size:12.5px}
.dbody .srct td:first-child{white-space:normal;padding-right:10px}
.srct td,.srct th{white-space:normal;overflow-wrap:anywhere}
.srct th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;font-weight:400;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
.srct td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);color:var(--ink-2);line-height:1.45;vertical-align:top}
.srct td:nth-child(2){color:var(--ink-3)}
.srct th:nth-child(1),.srct td:nth-child(1){width:48%}
.srct th:nth-child(2),.srct td:nth-child(2){width:29%}
.srct th:nth-child(3),.srct td:nth-child(3){width:23%}
.st{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border:1px solid;border-radius:3px;white-space:nowrap;display:inline-block}
.refs{margin-top:20px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.refs li{margin-bottom:9px;list-style:none;padding-left:16px;text-indent:-16px}
.refs a{color:var(--ink-3)}
@media(max-width:560px){.srct{font-size:11.5px}.srct td{padding:7px 6px 7px 0}}
.trace{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:1.8;border-top:1px solid var(--line);padding-top:16px;margin-top:24px}
.trace b{color:var(--ink-2);font-weight:500}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xs);margin-top:14px}
.note strong{color:var(--ink-2)}
details{margin-top:12px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-xs);overflow:hidden}
summary{padding:11px 14px;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:14px;list-style:none;transition:background .15s var(--ease)}
summary:hover{background:var(--paper)}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--ink-3)}
details[open] summary::before{content:"▾ "}
.dbody{padding:0 14px 14px;font-size:13px;color:var(--ink-2);line-height:1.6}
.dbody table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px;margin-top:6px}
.dbody td{border-bottom:1px solid var(--line);padding:4px 8px 4px 0;color:var(--ink-3);vertical-align:top}
.dbody td:first-child{color:var(--ink-2);white-space:nowrap;padding-right:14px}
@media(max-width:560px){
 .fld-n{font-size:11px}.fld-s{font-size:16px}.fld{padding:9px 7px 10px}
 .brand{font-size:18px}h2{font-size:20px}.tab{font-size:12px}
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#main.enter{animation:fadeInUp .32s var(--ease) both}
.tab{transition:color .15s var(--ease)}

/* ---- Mode urgence : mannequin de localisation ---- */
.mq{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
@media(max-width:620px){.mq{grid-template-columns:1fr}}
.mq-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:40px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.mq-label{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);background:var(--paper);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.mq-stage{width:100%;max-width:240px;aspect-ratio:64/182}
.mq-stage svg{width:100%;height:100%;cursor:crosshair;touch-action:manipulation;display:block}
.mq-body{fill:#232A31;stroke:var(--ink-2);stroke-width:.55;stroke-linejoin:round}
.mq-detail path{fill:none;stroke:var(--ink-3);stroke-width:.4;stroke-linecap:round}
.mq-iso{stroke:var(--accent);stroke-width:.5;stroke-dasharray:2 1.4}
.mq-tun{stroke:var(--ink-2);stroke-width:.4;stroke-dasharray:1.2 1.4;opacity:.8}
.mq-tx{font-family:var(--mono);font-size:2.6px;fill:var(--ink-2);letter-spacing:.02em;paint-order:stroke;stroke:var(--card);stroke-width:1.1px;pointer-events:none}
.mq-iso,.mq-tun{pointer-events:none}
.mq-mk{fill:var(--accent);stroke:var(--paper);stroke-width:.9}
.mq-mk.soft{fill:none;stroke:var(--accent);stroke-width:.8;stroke-dasharray:1 1}
.mq-fil{stroke:var(--accent);stroke-width:1.1;stroke-linecap:round;opacity:.55;pointer-events:none}
.mq-halo{fill:none;stroke:var(--accent);stroke-width:.45;opacity:.5}
.mq-rot{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-weight:500;font-size:14px;color:var(--ink);background:none;border:1px solid var(--line-2);border-radius:999px;padding:9px 18px;cursor:pointer;transition:border-color .15s var(--ease),color .15s var(--ease)}
.mq-rot:hover{border-color:var(--accent);color:var(--accent)}
.mq-rot svg{width:16px;height:16px}
.mq-side{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.mq-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}
.mq-k:first-child{margin-top:0}
.mq-v{font-size:15px;margin-top:3px}
.mq-v b{color:var(--accent-2);font-weight:600}
.mq-miss{color:var(--ink-3);font-style:italic;font-size:13.5px}
.mq-h{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
/* ---- Mode urgence : résultat par énergie ---- */
.uen{display:flex;flex-direction:column;gap:8px}
.uen-r{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xs);padding:12px 15px}
.uen-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.uen-k{font-family:var(--mono);font-size:11px;color:var(--ink-3);min-width:44px}
.uen-n{font-family:var(--cond);font-weight:600;font-size:16px;flex:1}
.uen-lv{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid;border-radius:999px;padding:3px 10px}
.uen-b{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-top:6px}

.printonly{display:none}
@media print{
  :root{--paper:#fff;--card:#fff;--ink:#111;--ink-2:#333;--ink-3:#555;--line:#ccc;--line-2:#bbb;--accent:#2F4FCB;--accent-2:#2F4FCB;
    --r0:#1E7A55;--r1:#7A6100;--r2:#A6550F;--r3:#A63F1D;--r4:#A82020;--r0bg:#EAF6EF;--r1bg:#FFF7D6;--r2bg:#FDEEDF;--r3bg:#FCE6DE;--r4bg:#FBE5E5}
  body{background:#fff!important;color:#111;font-size:12px}
  body::before,.accent-bar,#fields,#srcs,.actions,header .ver{display:none!important}
  .shell{max-width:none;padding:0}
  .printonly{display:block;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #ccc}
  .pr-h{font-family:var(--cond);font-size:18px;font-weight:600}
  .pr-d{font-size:11px;color:#555;margin:2px 0 8px}
  .pr-r{white-space:pre-wrap;font-family:var(--mono);font-size:10.5px;line-height:1.5;margin:0}
  .verdict,.uen-r,.mit,.note{box-shadow:none!important;break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important}
}
</style>
</head>
<body>
<div class="shell">

function log(q,a){ const i=S.trace.findIndex(t=>t[0]===q); const e=[q,a]; if(i>=0)S.trace[i]=e; else S.trace.push(e); }

/* ---------- géométrie ---------- */
function dOf(k){ return HYP.land[k].f*S.h; }
/* Position du dispositif : le mannequin (continu) si l'utilisateur a cliqué,
   sinon le repère anatomique. Les calculs sont strictement identiques à
   l'ancienne version quand le clic tombe sur un repère. */
function fImp(){ return S.mpt?S.mpt.f:HYP.land[S.imp].f; }
function bImp(){
  const dC=dOf(HYP.exams[S.ex].cible), d=fImp()*S.h;
  return S.ent==="tete" ? (d-dC) : (dC-d);
}
function latD(){
  if(!S.mpt) return HYP.lat[S.lat].d;
  const m=morphOf(S.h,S.w);
  return Math.min(HYP.boreDia/2,Math.hypot(S.mpt.lr*m.halfW/MQ_HALF_W,S.mpt.ap*m.halfD/MQ_HALF_D));
}
function bOf(k){
  const dC=dOf(HYP.exams[S.ex].cible);
  return S.ent==="tete" ? (dOf(k)-dC) : (dC-dOf(k));
}
function rfLen(){ return S.coil==="body"?HYP.rfLen:S.coil==="head"?HYP.headCoilLen:HYP.kneeCoilLen; }
function localCoil(){ return S.coil!=="body"; }
function rfZones(){
  const h=rfLen()/2;
  /* Antenne corps : le champ lui-même déborde. La bande intermédiaire est une
     décroissance réelle de B1, elle concerne tous les dispositifs. */
  if(!localCoil()) return [[0,h,2],[h,h+HYP.rfFalloff,1],[h+HYP.rfFalloff,95,0]];
  /* Antenne locale blindée : champ confiné. La bande ne marque plus un champ
     mais la région d'où le trajet d'un conducteur peut encore l'atteindre —
     sans objet pour un dispositif compact. */
  return S.linear==="yes"
    ? [[0,h,2],[h,h+HYP.rfReach,1],[h+HYP.rfReach,95,0]]
    : [[0,h,2],[h,95,0]];
}
function zonesFor(f){ return f==="B1"?rfZones():f==="dB/dt"?HYP.zonesDbdt:f==="dB/dx"?HYP.zonesDbdx:[[0,95,2]]; }
function levelAt(f,b){ const a=Math.abs(b); for(const[lo,hi,l] of zonesFor(f)) if(a>=lo&&a<hi) return l; return 0; }
function radialLevel(){ const d=latD(); for(const[lo,hi,l] of HYP.radial) if(d>=lo&&d<hi) return l; return 2; }
function inBore(){ return Math.abs(bImp())<=HYP.boreLen/2; }

/* Exposition géométrique par champ, 0–2.
   dB/dx est un cas à part : tout implant qui entre dans le tunnel traverse
   la zone de gradient spatial maximal. Sa position au moment de
   l'acquisition ne dit rien du risque — c'est le trajet qui compte. */
function expo(f){
  const b=bImp();
  if(f==="dB/dx") return inBore()?2:1;
  if(f==="B0")    return inBore()?2:1;
  return levelAt(f,b);
}

/* ---------- silhouette ---------- */
/* Profil du corps : demi-épaisseur antéro-postérieure (sagittal) et

   v = distance au vertex (cm, patient de référence de 170 cm),
   u = écart latéral (coronal) ou hauteur au-dessus de la table (sagittal).

function figTransform(view){
  const k=S.h/170, dC=dOf(HYP.exams[S.ex].cible), sgn=S.ent==="tete"?1:-1;
  return view==="sag"
    ? `matrix(0 ${-k} ${sgn*k} 0 ${-sgn*dC} ${HYP.tableDrop})`
    : `matrix(0 ${k} ${sgn*k} 0 ${-sgn*dC} 0)`;
}
function smoothPath(p){
  let d=`M ${p[0][0]} ${p[0][1]}`;
  for(let i=1;i<p.length-1;i++){
    const[x,y]=p[i],[x2,y2]=p[i+1];
    d+=` Q ${x} ${y} ${((x+x2)/2).toFixed(1)} ${((y+y2)/2).toFixed(1)}`;
  }
  const l=p[p.length-1]; return d+` L ${l[0]} ${l[1]}`;
}
function body(view){
  const lateral=S.pos==="latg"||S.pos==="latd";
  const fill=`fill="var(--skin)" stroke="var(--line-2)" stroke-width=".55" stroke-linejoin="round"`;
  /* en décubitus latéral, les deux vues échangent leurs profils */
  const useCor = (view==="cor") !== lateral;
  let inner;
  if(useCor){ inner=COR_FIG; }
  else {
    const pts=SAG_PROF.map(([v,u])=>[u,v]);
    const d=smoothPath(pts)+` L 0 ${SAG_PROF[SAG_PROF.length-1][0]} L 0 ${SAG_PROF[0][0]} Z`;
    inner=`<path d="${d}"/>`;
  }
  /* la vue coronale est centrée sur l'axe ; la sagittale repose sur la table */
  const off = useCor && view==="sag" ? ` transform="translate(0 -19)"` : "";
  return `<g ${fill} transform="${figTransform(view)}"><g${off}>${inner}</g></g>`;
}

/* ---------- bandes d'exposition ----------
   Vue sagittale : bandes axiales seules.
   Vue coronale : grille discrète axiale × radiale — le couplage augmente
   en s'éloignant de l'axe du tunnel, sauf pour B0 qui est homogène. */
function bands(f,view){
  const R=HYP.boreDia/2, radial=(view==="cor"&&f!=="B0"), out=[];
  /* la modulation radiale ne change pas le niveau, elle module son intensité :
     même couleur, trois crans discrets — jamais un dégradé continu */
  const rows = radial
    ? [[-R,-16,1.7],[-16,-9,1.0],[-9,9,.45],[9,16,1.0],[16,R,1.7]]
    : [[-R,R,1]];
  zonesFor(f).forEach(([lo,hi,l])=>{
    [[lo,hi],[-hi,-lo]].forEach(([a,bb])=>{
      const x=Math.max(a,-95), w=Math.min(bb,95)-x; if(w<=0) return;
      rows.forEach(([y0,y1,m])=>{
        const op=(l===0?1:m)*EXPO[l].a;
        out.push(`<rect x="${x}" y="${y0}" width="${w}" height="${(y1-y0).toFixed(1)}" fill="var(${EXPO[l].c})" opacity="${op.toFixed(3)}"/>`);
        if(l===1) out.push(`<rect x="${x}" y="${y0}" width="${w}" height="${(y1-y0).toFixed(1)}" fill="url(#h)" opacity="${(.4*(l===0?1:m)).toFixed(2)}"/>`);
      });
    });
  });
  if(radial) [-16,-9,9,16].forEach(y=>
    out.push(`<line x1="-95" y1="${y}" x2="95" y2="${y}" stroke="var(--ink-3)" stroke-width=".35" stroke-dasharray="1.5 2" opacity=".5"/>`));
  return out.join("");
}

    <rect x="-7.5" y="-3.4" width="15" height="6.8" rx="2.6" fill="none" stroke="${c}" stroke-width=".9" stroke-dasharray="2 1.4"/>`,
  inconnu:c=>`<circle cx="0" cy="0" r="5.2" fill="none" stroke="${c}" stroke-width="1.6"/>

function devName(){

function devShort(){
  return {actif:"dispositif actif",sonde:"sonde ou fil",passif:"implant passif",
    etranger:"corps étranger",tatouage:"tatouage",inconnu:"dispositif non identifié"}[S.kind]||"dispositif";
}

function draw(view){
  const R=HYP.boreDia/2, HL=HYP.boreLen/2, f=S.tab;
  const b=bImp(), latDv=latD();
  const antRegion=["pectoral","coeur","abdomen"].includes(S.imp);
  const sgnLat=S.lat==="central"?0:(antRegion?-1:1);
  let s=`<defs><pattern id="h" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="4" stroke="var(--ink-3)" stroke-width=".7"/></pattern>
    <clipPath id="cb"><rect x="${-HL}" y="${-R}" width="${2*HL}" height="${2*R}"/></clipPath></defs>`;
  s+=`<rect x="${-HL}" y="${-R}" width="${2*HL}" height="${2*R}" fill="var(--bore)" stroke="var(--line-2)" stroke-width=".8"/>`;
  s+=`<g clip-path="url(#cb)">${bands(f,view)}</g>`;
  if(view==="sag") s+=`<rect x="${-HL}" y="${HYP.tableDrop}" width="${2*HL}" height="2" fill="var(--line-2)"/>`;
  s+=`<g clip-path="url(#cb)" opacity=".92">${body(view)}</g>`;
  s+=`<line x1="0" y1="${-R-3}" x2="0" y2="${R+3}" stroke="var(--ink)" stroke-width=".7" stroke-dasharray="3 2"/>`;
  s+=`<text x="2" y="${R-2.6}" font-family="var(--mono)" font-size="3.2" fill="var(--ink)">ISOCENTRE</text>`;
  for(let x=-80;x<=80;x+=20){ if(!x)continue;
    s+=`<line x1="${x}" y1="${R}" x2="${x}" y2="${R+2}" stroke="var(--ink-3)" stroke-width=".5"/>`;
    s+=`<text x="${x}" y="${R+6.5}" text-anchor="middle" font-family="var(--mono)" font-size="3.1" fill="var(--ink-3)">${Math.abs(x)}</text>`;}
  s+=`<text x="${HL-2}" y="${-R-4.5}" text-anchor="end" font-family="var(--mono)" font-size="3.2" fill="var(--ink-3)">ENTRÉE ▸</text>`;
  if(view==="cor"&&f!=="B0")
    s+=`<text x="${-HL+2}" y="${-R+4.4}" font-family="var(--mono)" font-size="3" fill="var(--ink-3)">COUPLAGE CROISSANT VERS LA PAROI</text>`;
  const ant=HYP.tableDrop-19, post=HYP.tableDrop-4;
  const iy=view==="sag"?(S.pos==="ventre"?(antRegion?post:ant):(antRegion?ant:post)):(sgnLat*latDv);
  const lv=f==="dB/dx"||f==="B0"?expo(f):levelAt(f,b);
  const col=`var(${EXPO[lv].c})`;
  const bl=Math.max(-70,Math.min(70,b)), anc=b>56?"end":b<-56?"start":"middle";
  const g=(GLYPH[S.kind]||GLYPH.inconnu)(col);
  s+=`<line x1="${b}" y1="${iy-5}" x2="${bl}" y2="${-R-9}" stroke="var(--ink-3)" stroke-width=".5"/>
   <g transform="translate(${b} ${iy})"><circle r="8.4" fill="var(--paper)" opacity=".55"/>
   <circle r="8.4" fill="none" stroke="${col}" stroke-width=".7" opacity=".65"/>${g}</g>
   <text x="${bl}" y="${-R-11.5}" text-anchor="${anc}" font-family="var(--cond)" font-weight="600" font-size="4.2" fill="var(--ink)">${HYP.land[S.imp].n}</text>
   <text x="${bl}" y="${-R-6.6}" text-anchor="${anc}" font-family="var(--mono)" font-size="3.2" fill="var(--ink-3)">${devShort().toUpperCase()} · ${Math.round(Math.abs(b))} CM${inBore()?"":" · HORS TUNNEL"}</text>`;
  return s;
}

  render:()=>`<h2>Contexte de l'examen</h2>

/* Mannequin → repère anatomique le plus proche (libellés) et catégorie latérale. */
function sPlaceFromMannequin(){
  const p=S.mpt; if(!p) return;
  let best="vertex", dmin=9;
  for(const [k,v] of Object.entries(HYP.land)){
    if(k==="msup") continue;
    const d=Math.abs(v.f-p.f); if(d<dmin){ dmin=d; best=k; }
  }
  S.imp = Math.abs(p.lr)>17 ? "msup" : best;
  const d=latD();
  S.lat = d<5.5?"central":d<15?"leger":"franc";
}
function sReadout(){
  const el=$("mqread"); if(!el) return;
  const ex=HYP.exams[S.ex].n;
  if(!S.mpt){ el.innerHTML=`<div class="mq-k">Examen</div><div class="mq-v">${ex}</div>
    <div class="mq-h">La ligne bleue marque l'isocentre de cet examen ; les lignes grises, l'entrée du tunnel.</div>`; return; }
  const b=bImp();
  el.innerHTML=`<div class="mq-k">Examen</div><div class="mq-v">${ex}</div>
    <div class="mq-k">Repère le plus proche</div><div class="mq-v">${HYP.land[S.imp].n}</div>

    <div class="mq-k">Écart à l'axe du tunnel</div><div class="mq-v">${Math.round(latD())} cm — ${HYP.lat[S.lat].n.toLowerCase()}${S.mpt.hasAp?"":' <span class="mq-miss">(profondeur non précisée)</span>'}</div>
    <div class="mq-h">Distances estimées pour un patient de ${S.h} cm${S.w?", corpulence estimée depuis le poids":""}.</div>`;
}

/* 6 — forces mécaniques : B0 + dB/dx */
STEPS[6]={
  /* non ferromagnétique et non conducteur (et passif) : aucune force à évaluer,
     la question n'a pas lieu d'être — les scores sont calculés sans l'afficher */
  skip:()=>S.ferro==="no"&&S.cond==="no"&&S.kind!=="actif",
  render(){
    const qs=[], fer=S.ferro!=="no";
    if(fer&&S.anchored!=="yes") qs.push(Q("securable",`Le dispositif (${devShort()}) peut-il être immobilisé avant l'entrée en zone IV ?`,
      "Bandage compressif, contention externe, immobilisation mécanique.",
      [{l:"Oui",v:"yes"},{l:"Non",v:"no"}],true));
    if(fer) qs.push(Q("tissue",`Le dispositif (${devShort()}) est-il au contact d'un tissu où un déplacement serait dangereux ?`,
      "Structure vasculaire, tissu nerveux, œil, parenchyme pulmonaire, voisinage cardiaque.",
      [{l:"Non",v:"no"},{l:"Oui",v:"yes"},{l:"Inconnu",v:"unknown"}],true));
    if(S.cond!=="no") qs.push(Q("slow","Le déplacement du patient dans le tunnel peut-il être ralenti et contrôlé ?",
      "Un déplacement lent limite les forces de Lenz induites dans tout matériau conducteur, même non ferromagnétique.",
      [{l:"Oui",v:"yes"},{l:"Non",v:"no"}],true));
    if(S.kind==="actif"){
      qs.push(Q("funcB0","La fonction du dispositif est-elle altérée par le champ statique ou son gradient spatial ?",
        "Commutateur magnétique, reprogrammation, passage en mode asynchrone, arrêt de stimulation.",
        [{l:"Non",v:"no"},{l:"Oui",v:"yes"},{l:"Inconnu",v:"unknown"}],true));
      qs.push(Q("dependent","La santé du patient dépend-elle du fonctionnement continu du dispositif ?",
        "Patient stimulodépendant, suppléance vitale, perfusion continue.",
        [{l:"Non",v:"no"},{l:"Oui",v:"yes"},{l:"Inconnu",v:"unknown"}],true));
    }
    this.qs=qs;
    return `<h2>Forces mécaniques <em>B0 · dB/dx</em></h2>
    <div class="sub">${fer?"Le champ statique exerce un couple de rotation, homogène dans tout le volume d'imagerie et présent en permanence. Le gradient spatial exerce une force de translation, proche de zéro à l'isocentre et maximale aux extrémités du tunnel — le moment critique est donc le passage du patient, pas l'acquisition.":"Le matériau n'est pas ferromagnétique : ni couple de rotation ni force de translation significatifs, donc pas de question sur l'ancrage ni sur le voisinage tissulaire. Il reste le déplacement dans le champ, qui induit des courants dans tout matériau conducteur (forces de Lenz)."}</div>
    ${qs.map(q=>q.html).join("")}
    <div class="actions"><button class="act" id="next"${this.ready()?"":" disabled"}>Suivant</button></div>`;
  },
  bind(){ bindAll(this.qs); },
  ready(){
    if(S.ferro!=="no"){
      if(S.anchored!=="yes"&&!S.securable) return false;
      if(!S.tissue) return false;
    }
    if(S.cond!=="no"&&!S.slow) return false;
    if(S.kind==="actif"&&!(S.funcB0&&S.dependent)) return false;
    return true;
  },
  score(){
    let base=S.ferro==="no"?0:S.ferro==="unknown"?2:3;
    const w0=[],wx=[];
    if(S.ferro==="no"){ w0.push("Matériau non ferromagnétique : pas de couple significatif."); }
    else if(S.ferro==="unknown"){ w0.push("Ferromagnétisme non documenté : traité par précaution comme potentiellement ferromagnétique."); }
    if(S.ferro!=="no"){
      if(S.anchored==="yes"){ base-=1; w0.push("Ancrage stable : déplacement peu probable."); }
      else if(S.securable==="yes"){ base-=1; S.mitig.push(["Immobilisation","Immobiliser le dispositif avant l'entrée en zone IV et vérifier la contention après installation du patient."]); }
      else { base+=1; w0.push("Dispositif ni ancré ni immobilisable."); }
      if(S.tissue==="yes"){ base+=1; w0.push("Voisinage d'un tissu sensible au déplacement."); }
      else if(S.tissue==="unknown") w0.push("Localisation tissulaire imprécise.");
    }
    let s0=base; if(!inBore()){ s0-=1; w0.push("Dispositif hors du volume de l'aimant."); }
    let sx=base;
    wx.push(...w0.filter(x=>!x.startsWith("Dispositif hors")));
    if(S.cond!=="no"){
      if(sx<1){ sx=1; wx.push("Matériau conducteur : forces de Lenz possibles au passage, même sans ferromagnétisme."); }
      if(S.slow==="yes"){ sx=Math.max(0,sx-1); S.mitig.push(["Vitesse de déplacement","Faire progresser le patient lentement à l'entrée et à la sortie du tunnel : les forces de Lenz croissent avec la vitesse."]); }
      else { sx+=1; wx.push("Déplacement lent non réalisable."); }
    }
    if(inBore()) wx.push("Le dispositif traverse la zone de gradient spatial maximal à l'entrée et à la sortie.");
    if(S.kind==="actif"&&(S.funcB0==="yes"||S.funcB0==="unknown")){
      s0+=1; sx+=1; const t="Fonction du dispositif potentiellement altérée par le champ.";
      w0.push(t); wx.push(t);
      if(S.dependent==="yes"){ s0+=2; sx+=2; const u="Patient dépendant du dispositif : une altération de fonction a une conséquence directe."; w0.push(u); wx.push(u); }
      else if(S.dependent==="unknown"){ s0+=1; sx+=1; }
      S.mitig.push(["Encadrement du dispositif actif","Faire valider le mode de programmation et la surveillance péri-examen par le service référent avant l'installation."]);
    }
    return [{i:0,s:clamp(s0),w:w0},{i:1,s:clamp(sx),w:wx}];
  }
};

/* 7 — dB/dt */

      qs.push(Q("gradMitig","Une réduction de l'amplitude maximale de gradient est-elle envisageable ?",

    } else {
      qs.push(Q("vibr","Une vibration induite représenterait-elle un risque pour le dispositif ou le patient ?",

        [{l:"Non",v:"no"},{l:"Oui",v:"yes"},{l:"Inconnu",v:"unknown"}],true));
    }

    return `<h2>Gradients d'imagerie <em>dB/dt</em></h2>
    <div class="sub">Le gradient temporel est minimal à l'isocentre et maximal vers 35 cm au-dessus et en dessous du centre. Un examen centré loin du dispositif peut donc l'exposer davantage qu'un examen centré dessus.</div>
    <div class="note"><strong>${HYP.land[S.imp].n} à ${Math.round(Math.abs(b))} cm de l'isocentre : ${txt}.</strong> Ce niveau est calculé à partir de la taille du patient, de l'examen et de la localisation du dispositif.</div>
    ${qs.map(q=>q.html).join("")}
    <div class="actions"><button class="act" id="next"${this.ready()?"":" disabled"}>Suivant</button></div>`;
  },
  bind(){ bindAll(this.qs); },
  ready:()=>S.linear==="yes"?(S.tipExcit&&S.gradMitig):!!S.vibr,
  score(){
    const w=[]; const z=expo("dB/dt"); const b=bImp();
    if(S.cond==="no") return [{i:2,s:0,w:["Matériau non conducteur : pas de courant induit significatif."]}];
    let s;
    if(S.linear==="yes"){
      s=1+z; w.push(`Conducteur allongé à ${Math.round(Math.abs(b))} cm de l'isocentre, ${z===2?"dans la zone de gradient maximal":z===1?"en bordure de zone":"proche de l'isocentre"}.`);
      if(S.tipExcit==="cardiac"){ s+=2; w.push("Extrémité au contact du tissu cardiaque : potentialisation arythmogène."); }
      else if(S.tipExcit==="other"){ s+=1; w.push("Extrémité au contact d'un tissu excitable."); }
      else if(S.tipExcit==="unknown"){ s+=1; w.push("Position de l'extrémité non établie."); }
      if(s>=2){
        if(S.gradMitig==="yes"){ s-=1; S.mitig.push(["Adaptation de séquence","Réduire l'amplitude maximale de gradient : champ de vue élargi, coupes plus épaisses, séquences moins agressives."]); }
        else w.push("Adaptation de séquence non réalisable.");
      }
    } else {
      s=z===2?1:0;
      if(S.vibr==="yes"){ s+=2; w.push("Risque de vibration induite retenu."); }
      else if(S.vibr==="unknown"){ s+=1; w.push("Risque de vibration non établi."); }
      if(!s) w.push("Dispositif compact, hors de la zone de gradient maximal.");
    }
    if(S.kind==="actif"){ s+=1; w.push("Dispositif actif : tensions et courants induits susceptibles de perturber la fonction."); }

  }
};

/* Comparateur d'antennes d'émission. L'antenne n'est pas seulement un fait à
   enregistrer : quand plusieurs sont disponibles, c'est un levier que le TRM
   peut actionner. L'outil montre ce que chacune change, il ne choisit pas. */
function expoFor(coil){
  const save=S.coil; S.coil=coil;
  let e=expo("B1"); const L=rfLen();
  S.coil=save; return {e,L};
}
function coilCompare(){
  return Object.entries(COIL).map(([k,n])=>{
    const {e,L}=expoFor(k);
    const lbl=(e===1&&k!=="body"&&S.linear==="yes")?"Selon le trajet du conducteur":EXPO[e].n;
    return `<button type="button" class="cmpo${k===S.coil?" on":""}" data-c="${k}">
      <span class="cmpo-n">${n}</span>
      <span class="cmpo-l" style="color:var(${EXPO[e].c})">${lbl}</span>
      <span class="cmpo-d">${L} cm</span></button>`;
  }).join("");
}

/* Symboles d'antenne, famille IEC 60417. Le sens des têtes de flèche donne la
   fonction : vers le centre = émission, vers l'extérieur = réception, les deux
   = émission-réception (6192). Dessinés uniquement dans l'aide, repliée par
   défaut. */
function coilSymbol(kind){
  /* Bras construit le long de +x depuis le centre (50,50), puis répété par
     rotation. x croissant = on s'éloigne du centre. */
  const zig=(a,b)=>{
    const n=Math.max(4,Math.round((b-a)/3.2)), st=(b-a)/n; let d=`M ${a.toFixed(1)} 50`;
    for(let i=1;i<=n;i++) d+=` L ${(a+i*st).toFixed(1)} ${i===n?50:(50+(i%2?-2.5:2.5)).toFixed(1)}`;
    return `<path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  };
  const IN=62, OUT=86, H=6.2;
  const headIn =`<path d="M ${IN} 50 L ${IN+H} 46.4 L ${IN+H} 53.6 Z" fill="currentColor"/>`;
  const headOut=`<path d="M ${OUT} 50 L ${OUT-H} 46.4 L ${OUT-H} 53.6 Z" fill="currentColor"/>`;
  let arm;
  if(kind==="tx")      arm=headIn+zig(IN+H,OUT);
  else if(kind==="rx") arm=zig(IN,OUT-H)+headOut;
  else                 arm=headIn+zig(IN+H,OUT-H)+headOut;
  const arms=[45,135,225,315].map(a=>`<g transform="rotate(${a} 50 50)">${arm}</g>`).join("");
  return `<svg viewBox="0 0 100 104" width="88" height="92" role="img" aria-hidden="true">
    <path d="M 43.4 87.4 A 38 38 0 1 1 56.6 87.4" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 44.3 88.2 Q 42.4 95 44.4 101" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 55.7 88.2 Q 57.6 95 55.6 101" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    ${arms}</svg>`;
}

/* Aide contextuelle sur la nature de l'antenne. C'est l'entrée la plus
   susceptible d'être mal renseignée, et une erreur y sous-estime le risque. */
function helpCoil(){
  return `<details class="help"><summary>Comment savoir si mon antenne émet, reçoit, ou les deux ?</summary>
  <div class="dbody">
  <p><strong>L'information est sur l'antenne, pas sur la console.</strong> Le système n'indique pas si l'antenne en place émet ou se contente de recevoir. Il faut regarder l'antenne elle-même.</p>
  <p><strong>1. Le symbole normalisé.</strong> Les antennes portent un pictogramme défini par la norme IEC 60417, qui recense les symboles graphiques apposés sur les équipements. Le sens des flèches donne la fonction :</p>
  <div class="syms">
    <figure><div>${coilSymbol("tx")}</div><figcaption><strong>Émission</strong><span>Têtes vers le centre</span></figcaption></figure>
    <figure><div>${coilSymbol("rx")}</div><figcaption><strong>Réception</strong><span>Têtes vers l'extérieur</span></figcaption></figure>
    <figure><div>${coilSymbol("tr")}</div><figcaption><strong>Émission-réception</strong><span>Têtes dans les deux sens</span></figcaption></figure>
  </div>
  <p><strong>2. Le marquage écrit.</strong> Les mentions « T/R », « Tx/Rx » ou « transmit/receive » désignent une antenne émettrice-réceptrice ; « Rx » seul désigne une antenne réceptrice.</p>
  <p><strong>3. Son aspect.</strong> Une antenne tête émettrice-réceptrice est une cage d'oiseau : un cylindre à barreaux réguliers. Une antenne réceptrice multicanaux est un assemblage dense d'éléments.</p>
  <p><strong>4. Sa notice</strong> le précise explicitement, ainsi que ses conditions d'utilisation.</p>
  <p style="margin-top:12px"><strong>Si le doute persiste :</strong> demander au physicien médical ou au spécialiste d'application. En attendant, retenir l'antenne corps du tunnel — c'est l'hypothèse qui ne sous-estime jamais l'exposition.</p>
  <p style="margin-top:12px;color:var(--ink-3)">Pourquoi cela compte : une antenne réceptrice ne modifie en rien le volume irradié. Se tromper ici en déclarant une antenne locale alors que l'émission vient du tunnel produit une estimation faussement rassurante.</p>
  </div></details>`;
}

/* 8 — B1 */
STEPS[8]={
  /* matériau non conducteur : aucun couplage radiofréquence */
  skip:()=>S.cond==="no",
  render(){
    const F=FREQ[S.B], e=expo("B1"), rl=radialLevel(), b=bImp();
    /* tatouage : seuls l'ancienneté, l'étendue et le refroidissement comptent.
       Isolation : sans objet pour un objet compact. */
    const qs=[];
    if(!S.tattoo){
      qs.push(Q("len",`Longueur totale du trajet conducteur (${devShort()})`,
        `À ${MAG[S.B]} (${F.f} MHz), la longueur résonante en tissu est de l'ordre de ${F.Lr} cm. Le risque est maximal <em>au voisinage</em> de cette longueur — et la résonance est périodique, elle se reproduit sur les harmoniques.`,
        [{l:`Nettement inférieure à ${F.Lt} cm`,v:"short"},
         {l:`Proche de ${F.Lr} cm`,v:"resonant",t:"zone critique"},
         {l:`Supérieure à ${F.Lt} cm`,v:"long",t:"harmonique possible"},

      if(S.linear==="yes") qs.push(Q("insul","Isolation du conducteur","Une isolation épaisse réduit l'échauffement à l'extrémité pour les conducteurs courts.",
        [{l:"Isolé, extrémité dénudée",v:"insul"},{l:"Isolation épaisse ou double",v:"thick"},
         {l:"Conducteur nu",v:"bare"},{l:"Inconnue",v:"unknown"}]));
      qs.push(Q("multi",`Conducteurs multiples, croisés, ou en boucle (${devShort()})`,"Plusieurs sondes, mailles, treillis, ou boucle fermée susceptible d'entrer en résonance.",
        [{l:"Non — conducteur unique",v:"no"},{l:"Oui — multiples ou croisés",v:"multi"},

    }
    qs.push(Q("sink","Un dissipateur thermique peut-il être mis en place ?",
        "Compresse froide ou poche de gel au contact du point d'échauffement attendu, notamment l'extrémité dénudée.",
        [{l:"Oui",v:"yes"},{l:"Non",v:"no"}],true));
    if(S.linear==="yes"&&e<2) qs.unshift(Q("pathIn",
      `Le trajet du conducteur atteint-il le volume d'émission ?`,
      `Déterminant, et la géométrie ne peut pas y répondre seule. Une sonde de stimulateur cardiaque descend vers le cœur, donc s'éloigne d'une antenne tête. Une extension de neurostimulateur profond remonte vers le crâne, donc y entre. Un cathéter de pompe abdominale remonte le rachis. Le corps du dispositif peut être hors du volume alors que le conducteur y plonge.`,
      [{l:"Non — le conducteur s'éloigne du volume d'émission",v:"no"},
       {l:"Oui — une partie du trajet y entre",v:"yes"},
       {l:"Trajet non déterminé",v:"unknown"}]));
    if(S.tattoo){
      qs.push(Q("tattooAge","Ancienneté du tatouage","Les encres anciennes contiennent plus fréquemment des composés métalliques.",
        [{l:"Moins de 6 semaines",v:"new",t:"cicatrisation"},{l:"Ancien, cicatrisé",v:"old"},{l:"Inconnue",v:"unknown"}],true));
      qs.push(Q("tattooSize","Étendue du tatouage","",
        [{l:"Petit",v:"small"},{l:"Étendu",v:"large",t:"surveillance"}],true));
    }
    this.qs=qs;
    const pos=e===2?"dans le volume d'émission":e===1?(localCoil()?"hors du volume d'émission, mais assez près pour qu'un conducteur allongé puisse l'atteindre":"juste au-delà de l'antenne, dans la zone où le champ décroît sans s'annuler"):"hors du volume d'émission";
    const rad=rl===2?" Sa latéralisation le place près de la paroi, où le champ électrique induit est le plus fort — facteur dominant de l'échauffement.":rl===1?" Sa position latérale est intermédiaire.":" Sa position centrale réduit le champ électrique induit.";
    return `<h2>Radiofréquence <em>B1</em></h2>
    <div class="sub">Ce n'est pas le champ B1 qui échauffe, mais les champs électriques qu'il induit. Deux situations à distinguer : le champ de l'antenne corps décroît au-delà de l'antenne sans s'annuler, alors qu'une antenne locale blindée le confine. Dans ce second cas, ce qui franchit la frontière n'est pas le champ mais le conducteur — une sonde dont une partie baigne dans le volume peut concentrer l'énergie à son extrémité, même très loin de là.</div>
    <div class="note"><strong>${HYP.land[S.imp].n} à ${Math.round(Math.abs(b))} cm de l'isocentre : ${pos} (${COIL[S.coil].toLowerCase()}, ${rfLen()} cm).</strong>${rad} Repère : à ${MAG[S.B]}, la longueur résonante dans l'air est de ${F.Lair} ; en tissu elle est très nettement raccourcie par la permittivité du milieu.</div>
    <div class="eyebrow">Antenne d'émission — ce que chaque option change</div>
    <div class="cmp" id="cmp">${coilCompare()}</div>
    <div class="fh" style="margin:8px 0 0">Le choix de l'antenne d'émission appartient au TRM lorsque plusieurs sont disponibles. Sélectionner une option recalcule l'analyse. Ne retenir une antenne émettrice-réceptrice que si le matériel est réellement présent et utilisable pour cet examen.</div>
    ${helpCoil()}
    ${qs.map(q=>q.html).join("")}
    <div class="actions"><button class="act" id="next"${this.ready()?"":" disabled"}>Voir la synthèse</button></div>`;
  },
  bind(){
    bindAll(this.qs);
    document.querySelectorAll(".cmpo").forEach(btn=>btn.onclick=()=>{
      if(btn.dataset.c===S.coil) return;
      S.coil=btn.dataset.c; log("Antenne d'émission",COIL[S.coil]);
      go(8);
    });
  },
  ready(){
    let b=S.sink&&(S.tattoo||(S.len&&S.multi&&(S.linear!=="yes"||S.insul)));
    if(S.linear==="yes"&&expo("B1")<2&&!S.pathIn) b=false;
    return S.tattoo?(b&&S.tattooAge&&S.tattooSize):!!b;
  },
  score(){
    const w=[]; if(S.cond==="no") return [{i:3,s:0,w:["Matériau non conducteur : pas de couplage radiofréquence."]}];
    let e=expo("B1"); const rl=radialLevel(), F=FREQ[S.B];
    /* Le trajet du conducteur prime sur la position du boîtier : c'est lui qui
       décide s'il y a couplage, pas la géométrie du dispositif. */
    if(S.linear==="yes"&&e<2){
      if(S.pathIn==="yes"){ e=2; w.push("Le trajet du conducteur atteint le volume d'émission : le couplage a lieu, même si le corps du dispositif est en dehors."); }
      else if(S.pathIn==="unknown"){ e=Math.max(e,1); w.push("Trajet du conducteur non déterminé : couplage non écarté."); }
      else if(localCoil()){ e=0; w.push("Le trajet du conducteur s'éloigne du volume d'émission, et le champ d'une antenne locale blindée ne déborde pas."); }
      else w.push("Le trajet du conducteur n'atteint pas le cœur du volume d'émission, mais le champ de l'antenne corps décroît sans s'annuler.");
    }
    if(e===0) return [{i:3,s:0,w:[...w,
      `Aucune partie du dispositif n'est exposée au champ d'émission (${COIL[S.coil].toLowerCase()}, ${rfLen()} cm) : pas de couplage radiofréquence.`]}];
    let s;
    if(S.len==="resonant"){ s=3; w.push(`Longueur proche de la longueur résonante à ${MAG[S.B]} (${F.Lr} cm).`); }
    else if(S.len==="unknown"){ s=2; w.push("Longueur conductrice inconnue : résonance non écartée."); }
    else if(S.len==="long"){ s=2; w.push("Longueur au-delà de la résonance fondamentale : la résonance étant périodique, un harmonique ne peut être écarté sans mesure."); }
    else { s=1; w.push("Longueur nettement inférieure à la résonance."); }
    if(rl===2){ s+=2; w.push("Trajet périphérique : couplage maximal avec le champ électrique induit."); }
    else if(rl===1){ s+=1; w.push("Position latérale intermédiaire."); }
    else w.push("Trajet central : champ électrique induit plus faible.");
    if(S.insul==="thick"){ s-=1; w.push("Isolation épaisse : échauffement d'extrémité réduit."); }
    else if(S.insul==="bare"){ s+=1; w.push("Conducteur nu."); }
    if(S.multi==="multi"){ s+=1; w.push("Conducteurs multiples ou croisés."); }
    else if(S.multi==="loop"){ s+=1; w.push("Boucle fermée : résonance de boucle possible."); }
    else if(S.multi==="unknown"){ s+=1; w.push("Configuration des conducteurs non établie."); }
    if(e===1){ s-=1; w.push("Couplage partiel avec le volume d'émission."); }
    else w.push(`Couplage avec le volume d'émission (${COIL[S.coil].toLowerCase()}, ${rfLen()} cm).`);
    if(S.linear!=="yes"){ s-=1; w.push("Dispositif compact : pas d'effet d'antenne."); }
    if(S.tattoo){
      s-=1; w.push("Tatouage traité comme implant passif conducteur, avec un niveau réduit d'un cran.");
      if(S.tattooAge==="new"){ s+=1; w.push("Tatouage récent, non cicatrisé."); }
      if(S.tattooSize==="large"&&e>0){ s+=1; w.push("Tatouage étendu dans le volume d'émission."); }
      S.mitig.push(["Surveillance du tatouage","Informer le patient de signaler immédiatement toute sensation de chaleur. Compresse froide sur la zone si étendue ou récente."]);
    }
    if(s>=2){
      if(S.sink==="yes"){ s-=1; S.mitig.push(["Dissipateur thermique","Placer une compresse froide au contact du point d'échauffement attendu, notamment l'extrémité dénudée du conducteur."]); }
      S.mitig.push(["Surveillance active","Maintenir le contact verbal. Faire signaler immédiatement toute sensation de chaleur, de picotement ou de brûlure. Réduire le SAR autant que l'indication le permet."]);
    }
    return [{i:3,s:clamp(s),w}];
  }
};

/* Disponibilité. Sans statusUrl, on annonce un délai de réponse plutôt qu'une
   présence : un point vert sur un outil de sécurité promet une disponibilité
   qu'un fichier local ne peut pas garantir. */
const ETATS={
  ligne:{c:"--r0",t:"En ligne"},
  recent:{c:"--r2",t:"Connecté récemment"},
  hors:{c:"--r4",t:"Hors ligne"}
};
function showDot(c,t){ const d=$("dot"); if(d) d.innerHTML=`<i style="background:var(${c})"></i><span>${t}</span>`; }
function setDot(){
  if(!CONTACT.statusUrl){ showDot("--line-2",`Réponse sous ${CONTACT.delai}`); return; }
  showDot("--line-2","Vérification…");
  fetch(CONTACT.statusUrl,{cache:"no-store"})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(j=>{ const e=ETATS[j&&j.etat]; e?showDot(e.c,e.t):showDot("--line-2",`Réponse sous ${CONTACT.delai}`); })
    .catch(()=>showDot("--line-2",`Réponse sous ${CONTACT.delai}`));
}

/* 9 — synthèse */
function dedupe(a){ const s=new Set(); return a.filter(m=>s.has(m[0])?false:(s.add(m[0]),true)); }
STEPS[9]={

    ][max];

    const unk=S.trace.filter(t=>/inconnu|non détermin|non retrouv|non vérifiab|non identifi/i.test(t[1]));
    return `<h2>Synthèse de l'analyse</h2>
    <div class="sub">Le niveau global retenu est le plus élevé des quatre champs. Un seul mécanisme suffit à porter le risque.</div>
    <div class="verdict" style="background:var(${sc.bg});border-color:var(${sc.c})">
      <div class="verdict-k" style="color:var(${sc.c})">${actifRef?"Implant actif · conditions du fabricant":`Niveau ${max} sur 4 · déterminé par ${worst.k}`}</div>
      <div class="verdict-t" style="color:var(${sc.c})">${actifRef?"Aucune adaptation de l'outil : le fabricant fait foi":sc.n}</div>
      <div class="verdict-b" style="color:var(${sc.c})">${msg2}</div></div>
    <div class="scale">${SCALE.map((x,i)=>`<div style="color:var(${x.c});${i===max?`background:var(${x.bg});font-weight:600`:""}">${i} · ${x.s}</div>`).join("")}</div>

/* Valide une étape : calcule ses scores et ses mesures. Idempotent — si
   l'utilisateur revient en arrière, les mesures ajoutées par cette étape et
   les suivantes sont retirées avant d'être recalculées. */
function commitStep(n){
  if(S.snap[n]!==undefined&&S.snap[n]<S.mitig.length) S.mitig.length=S.snap[n];
  S.snap[n]=S.mitig.length;
  STEPS[n].done&&STEPS[n].done();
  if(STEPS[n].score) STEPS[n].score().forEach(r=>{ S.scores[r.i]=r.s; S.detail[r.i]=r.w; });
}
/* Implant actif : on ne déroge pas aux conditions du fabricant. Sans
   documentation, ou si une condition ne peut être respectée, ou si elle n'est
   pas vérifiable, l'IRM n'est pas recommandée ; documenté et conforme, le
   fabricant fait foi. Aucun calcul générique ne remplace ces conditions. */
function actifVerdict(kind){
  const set=(v,t)=>{ S.scores=[v,v,v,v]; S.detail=[0,1,2,3].map(()=>[t]); };
  if(kind==="ok"){
    set(0,"Implant actif étiqueté MR Conditional, conditions du fabricant respectées : le fabricant fait foi.");
    S.mitig.push(["Conditions du fabricant","Se référer aux conditions techniques du fabricant : elles font foi, et cet outil n'y déroge pas."],
      ["Programmation pré-examen","Programmation pré-examen selon les instructions du fabricant, par le service référent, et reprogrammation après l'examen."],
      ["Stimulateur ou défibrillateur cardiaque","Monitoring ECG et SpO₂ pendant tout l'examen ; matériel de réanimation et personnel formé à disposition hors de la salle d'aimant."]);
    return;
  }
  const t=kind==="sansdoc"?"Implant actif sans documentation du fabricant : l'IRM n'est pas recommandée (une programmation pré-examen est nécessaire dans la majorité des cas, impossible sans connaître le modèle)."
    :kind==="non"?"Au moins une condition du fabricant ne peut être respectée : l'outil ne déroge pas aux conditions d'un implant actif."
    :"Conditions du fabricant non vérifiables à ce stade : à lever avant toute décision. L'outil ne déroge pas aux conditions d'un implant actif.";
  set(4,t);
  S.mitig.push(["Documentation","Obtenir la carte patient, le dossier ou la fiche du centre implanteur, et contacter le référent de l'implant avant toute décision."]);
}
function goBack(){ const p=S.hist.pop(); if(p!=null) go(p,true); }
function go(n,isBack){
  while(STEPS[n]&&STEPS[n].skip&&STEPS[n].skip()){ if(!isBack) commitStep(n); n++; }
  VIEW="expert";
  if(!isBack&&S.cur!=null&&S.cur!==n) S.hist.push(S.cur);
  S.cur=n; S.step=n;
  $("main").innerHTML=STEPS[n].render();
  drawFields();
  drawSources();
  STEPS[n].bind&&STEPS[n].bind();
  const nx=$("next");
  /* « Précédent » : secondaire, placé avant le bouton qui fait avancer */
  if(S.hist.length&&!$("eback")){
    const acts=[...document.querySelectorAll("#main .actions")].pop();
    if(acts){ const bt=document.createElement("button"); bt.type="button"; bt.className="gh"; bt.id="eback"; bt.textContent="Précédent";
      bt.onclick=goBack; acts.insertBefore(bt,acts.firstChild); }
  }
  if(nx){
    nx.disabled=!STEPS[n].ready();
    nx.onclick=()=>{
      commitStep(n);
      if(n===2&&S.label==="safe"){
        S.scores=[0,0,0,0];
        S.detail=[0,1,2,3].map(()=>["Étiquetage MR Safe vérifié."]);
        S.mitig.push(["Documentation","Consigner la vérification de l'étiquetage MR Safe dans le dossier du patient."]);
        return go(9);
      }
      if(n===2&&S.label==="unsafe"){
        S.scores=[4,4,4,4];
        S.detail=[0,1,2,3].map(()=>["Étiquetage MR Unsafe : dispositif explicitement contre-indiqué en environnement IRM."]);
        S.mitig.push(["Documentation","Consigner l'étiquetage MR Unsafe et la décision du médecin radiologue responsable de l'IRM dans le dossier du patient."]);
        return go(9);
      }
      if(S.kind==="actif"){
        if(n===2&&(S.label==="none"||S.label==="unknown")){ actifVerdict("sansdoc"); return go(9); }
        if(n===3){ actifVerdict(S.complies==="yes"?"ok":S.complies==="no"?"non":"inverif"); return go(9); }
      }
      go(n+1);
    };
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
function startExpert(from){
  reset();
  /* depuis le mode urgence : reprendre le contexte et la position déjà désignés */
  if(from){
    const x=HYP.exams[from.ex];
    Object.assign(S,{ex:from.ex,B:from.B,coil:from.coil,pos:from.pos||x.pos,ent:x.ent,
      h:from.h||170,w:from.w||null,mpt:from.pt?{...from.pt}:null});
    sPlaceFromMannequin();
  }

/* ---------- Morphologie : estimation NHANES ----------
   Tour de taille prédit depuis l'IMC (Bozeman et al. 2012, NHANES
   2001-2002). L'outil ne demande ni le sexe ni l'âge : moyenne des
   équations hommes / femmes à 45 ans, groupe de référence.
     hommes : 22,61306 + 2,520738·IMC + 0,1583812·âge
     femmes : 28,81919 + 2,218007·IMC − 3,688953 + 0,125975·âge
   Le tronc est ensuite assimilé à une ellipse (largeur = 1,35 × épaisseur,
   convention de l'outil) pour en tirer largeur et épaisseur. */
const MORPH={ref:{h:170,bmi:25}, ratio:1.35,
  wcFromBmi:bmi=>((22.61306+0.1583812*45+28.81919-3.688953+0.125975*45)/2)+((2.520738+2.218007)/2)*bmi};
function uMorph(){ return morphOf(U.h,U.w); }
function morphOf(hIn,wIn){
  const h=hIn||MORPH.ref.h;
  const bmi=wIn?Math.max(14,Math.min(60,wIn/((h/100)**2))):MORPH.ref.bmi;
  const wc=MORPH.wcFromBmi(bmi), k=MORPH.ratio;
  const g=3*(1+1/k)-Math.sqrt((3+1/k)*(1+3/k));          // Ramanujan
  const halfW=wc/(Math.PI*g), halfD=halfW/k;
  return {h,bmi,wc,halfW,halfD,assumedH:!hIn,assumedW:!wIn};
}

  for(let i=0;i<n;i++){

    d+=` C ${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;

function mqDraw(){ const C=mqCtx(); $("mqstage").innerHTML=mqSvg(); $("mqlabel").textContent=MQ_VIEWS[C.view].label; mqBindClick(); C.changed(); }
function mqBindClick(){

/* coordonnées du marqueur dans la vue courante (le profil gauche et le dos sont des miroirs) */

/* ---------- Géométrie patient dans le tunnel ---------- */
/* Repère du TUNNEL : z le long du tunnel, X horizontal, Y vertical.
   Le patient est décrit dans son propre repère (gauche-droite, avant-arrière) ;
   la position sur la table fait correspondre l'un à l'autre. L'isocentre est
   supposé sur l'axe médian du patient. */
const FIL_SPAN=20;   // un fil désigné par un seul point : trajet estimé à ±20 cm
function uGeom(){
  const m=uMorph(), p=U.pt||{f:0,lr:0,ap:0};
  const fT=HYP.land[HYP.exams[U.ex].cible].f;
  const z=(p.f-fT)*m.h;                                   // point désigné, cm
  const x=p.lr*m.halfW/MQ_HALF_W;                          // patient : gauche (+) / droite
  const y=p.ap*m.halfD/MQ_HALF_D;                          // patient : avant (+) / arrière
  const [X,Y]={dos:[x,y],ventre:[-x,-y],latg:[y,-x],latd:[-y,x]}[U.pos]||[x,y];
  const r=Math.min(HYP.boreDia/2,Math.hypot(x,y));
  const lv=(zones,a)=>{ for(const[lo,hi,l] of zones) if(a>=lo&&a<hi) return l; return 0; };
  /* fil : on évalue tout le segment z ± 20 cm et on retient le pire point */
  const fil=U.nature==="fil";
  /* le trajet ±20 cm reste dans la région anatomique désignée : une sonde
     thoracique ne descend pas dans l'abdomen, une sonde abdominale pas dans
     le bassin (fractions de la taille, du vertex vers les pieds). */
  let zs=[z];
  if(fil){
    const reg=Math.abs(p.lr)>17?[0.17,0.56]
      :[[0,.13],[.13,.165],[.165,.33],[.33,.47],[.47,.56],[.56,.72],[.72,.94],[.94,1]].find(([a,b])=>p.f>=a&&p.f<b)||[0,1];
    const lo=Math.max(z-FIL_SPAN,(reg[0]-fT)*m.h), hi=Math.min(z+FIL_SPAN,(reg[1]-fT)*m.h);
    zs=Array.from({length:21},(_,i)=>lo+i*(hi-lo)/20);
  }
  const zMin=zs.reduce((a,b)=>Math.abs(b)<Math.abs(a)?b:a);
  const inBore=zs.some(v=>Math.abs(v)<=HYP.boreLen/2);
  const zDt=zs.reduce((a,b)=>lv(HYP.zonesDbdt,Math.abs(b))>lv(HYP.zonesDbdt,Math.abs(a))?b:a);
  const dt={z:lv(HYP.zonesDbdt,Math.abs(zDt)),x:lv(HYP.zonesDbdt,Math.abs(X)),y:lv(HYP.zonesDbdt,Math.abs(Y))};
  /* antenne corps : le champ déborde de la longueur physique ; antenne locale
     blindée : champ confiné, seul un fil peut conduire l'énergie au-delà. */
  const L=U.coil==="head"?HYP.headCoilLen:U.coil==="knee"?HYP.kneeCoilLen:HYP.rfLen, hL=L/2;
  const zones=U.coil==="body"?[[0,hL,2],[hL,hL+HYP.rfFalloff,1]]
             :(fil?[[0,hL,2],[hL,hL+HYP.rfReach,1]]:[[0,hL,2]]);
  const b1=Math.max(...zs.map(v=>lv(zones,Math.abs(v))));
  return {m,z,zMin,zDt,fil,zLo:Math.min(...zs),zHi:Math.max(...zs),fT,x,y,X,Y,r,inBore,dt,Edt:Math.max(dt.z,dt.x,dt.y),Eb1:b1,periph:r>=16};
}
const cm=v=>Math.round(Math.abs(v));
function sideTxt(x){ return Math.abs(x)<1.5?"sur l'axe médian":`${cm(x)} cm vers la ${x>0?"gauche":"droite"} du patient`; }
function apTxt(y){ return Math.abs(y)<1.5?"au milieu de l'épaisseur du corps":`${cm(y)} cm vers ${y>0?"l'avant":"l'arrière"}`; }

/* ---------- Niveau par énergie : 0 faible · 1 modéré · 2 élevé ----------
   info:true = affiché pour comprendre, mais n'entre pas dans l'orientation. */
const HEAD_EX=["crane","orl"];
function uRfZone(){ const g=uGeom(); return g.Eb1; }
function uSarNote(){
  /* Conditions SAR pour un implant passif sans conditions précises
     (fiche HUG implants cardiaques passifs ; Shellock, MRIsafety.com). */
  const passif=U.nature==="passif"||["coronaire","valve"].includes(U.struct);
  if(!passif||U.compat==="conditionnel_precis") return null;
  const g=uGeom(), head=HEAD_EX.includes(U.ex), ortho=U.struct==="os";
  if(g.Eb1>=1){
    let t="Implant dans le volume d'émission RF : <strong>mode SAR normal</strong> (2 W/kg corps entier, 3,2 W/kg tête)";
    t+= ortho ? " ; le mode de premier niveau (4 W/kg) seulement sur validation du médecin radiologue." : " ; pas de mode de premier niveau.";
    if(head) t+=" IRM cérébrale : rien à changer, la limite de 3,2 W/kg pour la tête est la même dans tous les modes.";
    return t;
  }
  return "Implant entièrement hors du volume d'émission RF : le <strong>mode de premier niveau</strong> (4 W/kg corps entier) est possible.";
}
function uEnergies(){
  const g=uGeom(), doc=U.compat==="conditionnel_precis";
  const B=+U.B, hi=B>=3, mag=MAG[U.B];
  const st=U.struct, nat=["coronaire","valve"].includes(st)?"passif":U.nature, fil=nat==="fil";
  const small=U.taille==="petit"||st==="clip", fixe=U.mobile==="ancien";
  const alloy=U.alloy, sens=["oeil","vital","nerf"].includes(st);        // structure où un déplacement est grave
  const zTxt=g.fil?`trajet estimé à ±${FIL_SPAN} cm dans la même région anatomique, point le plus proche à ${cm(g.zMin)} cm de l'isocentre`:`à ${cm(g.z)} cm de l'isocentre le long du tunnel`;
  const E=(k,n,lv,why,conseil,info)=>({k,n,lv,why,conseil,info:!!info});
  const all0=w=>[E("B0","Couple de rotation (B0)",0,w,"couple"),E("dB/dx","Force de translation (gradient spatial de B0, dB/dx)",0,w,"translation"),
                 E("dB/dt","Stimulation (gradients, dB/dt)",0,w,"dbdt"),E("B1","Échauffement (radiofréquence, B1)",0,w,"b1")];

  /* Implants cardiaques passifs et stents coronaires : aucune contrainte de
     gradient spatial, pas de délai après la pose, 1,5 ou 3 T (fiche HUG ;
     Shellock). Seule condition : le mode SAR (voir uSarNote). */
  if(st==="coronaire") return all0("Stent coronaire : aucun stent coronaire ferromagnétique connu ; pas de contrainte de gradient spatial ni de délai après la pose, jusqu'à 3 T. Seule condition : le mode SAR indiqué plus bas.");
  if(st==="valve"&&U.valveYear==="autre") return all0("Implant cardiaque passif actuellement commercialisé : pas de contrainte de gradient spatial ni de délai après la pose, à 1,5 ou 3 T. Seule condition : le mode SAR indiqué plus bas.");
  /* Implant actif documenté : couvert par les conditions du fabricant. */
  if(nat==="actif"&&doc) return all0(`Couvert par les conditions du fabricant — vérifier que ${mag}, l'antenne et le SAR prévus y figurent, et réaliser la programmation pré-examen.`);
  if(doc) return all0(`Couvert par les conditions de l'étiquetage, à condition de les respecter (vérifier que ${mag} y figure).`);

  const vasc=st==="vaisseau"&&nat==="passif", conduit=st==="conduit"&&nat==="passif";
  const ortho=st==="os"&&nat==="passif", oType=U.orthoType;
  const condPassif=U.compat==="conditionnel_flou"&&nat==="passif"&&!hi;
  const out=[];

  /* ---- B0 et dB/dx : présents dès l'entrée dans le tunnel ; modulés par le
     matériau et l'ancrage, pas par la position finale. ---- */
  let force=g.inBore?2:1, fWhy=[];
  fWhy.push(g.inBore?"L'implant entre dans le tunnel : le couple s'exerce partout dans le volume, quelle que soit la position"
                    :`L'implant reste hors du tunnel (${zTxt}) : il n'est exposé qu'aux gradients de champ magnétique statique (dB/dx)`);
  if(fil){ force=0; fWhy.push("fil ou sonde : le risque n'est pas le déplacement mais l'échauffement"); }
  else if(st==="clip"&&U.clipYear==="2000"){ force=0; fWhy.push("clip posé en 2000 ou après : aucun clip ferromagnétique connu posé depuis (Hofman 2024)"); }
  else if(vasc){ force=0; fWhy.push("implant vasculaire passif : risque de déplacement considéré comme faible"); }
  else if(conduit){ force=0; fWhy.push("stent non vasculaire : pas de modèle ferromagnétique connu"); }
  else if(ortho&&oType!=="externe"){ force=fixe?0:1; fWhy.push(fixe?"matériel ancré dans l'os, ancien : il ne bougera pas":"matériel ancré dans l'os, mais récent"); }
  else if(alloy==="nonmetal"){
    force=0; fWhy.push("matériau non métallique : aucune interaction avec le champ statique");
  }
  else if(alloy==="nonferro"){
    force=0; fWhy.push("alliage non ferromagnétique (titane, plomb, cuivre…) : pas de couple ni de force de déplacement notables — à condition que cette information soit fiable (compte rendu opératoire, fabricant)");
  }
  else {
    if(U.compat==="conditionnel_flou"){
      if(!hi){ force=Math.min(force,1); fWhy.push("le fabricant le déclare conditionnel, ce qui exclut en pratique un ferromagnétisme marqué"); }
      else fWhy.push(`étiqueté conditionnel, mais sans conditions lisibles on ne peut pas confirmer que ${mag} est couvert`);
    }
    if(alloy==="ferro") fWhy.push("alliage ferromagnétique ou présumé tel : couple et force de déplacement possibles, proportionnels à la masse de métal et à l'intensité du champ");
    else if(alloy==="inconnu"||(alloy==null&&(U.ident==="inconnu"||nat==="inconnue"||nat==="etranger"))) fWhy.push("alliage inconnu : traité comme potentiellement ferromagnétique par prudence (la radiographie et le scanner donnent la position, la taille et la densité, pas l'alliage)");
    if(small&&fixe&&!hi&&force>1&&!sens){ force=1; fWhy.push("élément de moins de 2 cm, fixe, loin d'une structure sensible"); }
    else if(small&&fixe&&sens) fWhy.push("élément petit et ancien, mais au contact d'une structure où un déplacement, même minime, est grave : pas de réduction du niveau");
    else if(small&&fixe&&hi) fWhy.push(`élément petit et fixe, mais à ${mag} le couple est environ 4 fois celui de 1,5 T`);
    if(sens&&alloy!=="nonferro") fWhy.push(st==="oeil"?"œil : l'élément n'est retenu que très faiblement, une rotation ou un déplacement lèse directement la rétine ou le nerf optique":st==="vital"?"au contact d'une structure vitale : un déplacement, même de quelques millimètres, peut être grave":"au contact d'un nerf : un déplacement peut léser le nerf");
    if(!sens&&(U.ident==="inconnu"||nat==="etranger"||nat==="inconnue")&&alloy!=="ferro") fWhy.push("si l'élément est dans les tissus mous, la graisse, le muscle ou l'os et loin d'un vaisseau ou d'un nerf, un déplacement serait peu dangereux");
    if(B<1.5) fWhy.push(`champ de ${mag} : couple nettement plus faible qu'à 1,5 T`);
  }
  out.push(E("B0","Couple de rotation (B0)",force,fWhy.join(" ; ")+".","couple"));
  out.push(E("dB/dx","Force de translation (gradient spatial de B0, dB/dx)",force,force===0?"Même raisonnement que pour le couple : risque de déplacement faible pour ce type de matériel.":
    (g.inBore?"Maximale à l'entrée du tunnel, quasi nulle à l'isocentre : le risque se joue pendant le déplacement de la table, pas pendant l'acquisition.":"L'implant ne franchit pas l'entrée du tunnel ; il n'est exposé qu'aux gradients de champ magnétique statique (dB/dx)."),"translation"));

  /* ---- dB/dt : gradué sur les trois axes, axe le plus défavorable. Pour un
     matériel passif, pas de stimulation : niveau informatif seulement. ---- */
  const axes=[["le long du tunnel",g.dt.z,cm(g.zDt)],["horizontalement dans le tunnel",g.dt.x,cm(g.X)],["verticalement dans le tunnel",g.dt.y,cm(g.Y)]];
  const worst=axes.reduce((a,b)=>b[1]>a[1]?b:a);
  const zoneN=["Zone de gradient faible","Zone intermédiaire","Zone de gradient maximal"][g.Edt];
  const passifDt = nat==="passif" || nat==="etranger" || (nat==="inconnue"&&small);
  let dt, dWhy=`${zoneN} — axe le plus défavorable : ${worst[0]} (${worst[2]} cm de l'isocentre).`, dInfo=false;
  if(passifDt){
    dt = small?0:g.Edt; dInfo=true;
    dWhy+= small?" Élément de moins de 2 cm : courants induits négligeables."
                :" Implant passif ou corps étranger : pas de stimulation possible (la stimulation concerne les implants actifs et les conducteurs allongés). Dans un objet volumineux, les gradients peuvent induire des courants (vibration, sensation de chaleur) — <em>informatif, n'entre pas dans l'orientation</em>.";
  } else {
    dt=g.Edt;
    if(nat==="actif") dWhy+=" Implant actif : les gradients peuvent induire des courants dans ses sondes ou perturber son électronique.";
    else if(fil) dWhy+=" Fil ou sonde : les gradients induisent des courants le long du conducteur, jusqu'à son extrémité.";
    else dWhy+=" Nature inconnue : on ne peut pas exclure un implant actif ou un conducteur allongé ; niveau calculé par prudence.";
  }
  out.push(E("dB/dt","Stimulation (gradients, dB/dt)",dt,dWhy,"dbdt",dInfo));

  /* ---- B1 ---- */
  const F=FREQ[U.B], coilN=COIL[U.coil].toLowerCase();
  let b1=g.Eb1, bWhy=["Hors du volume d'émission","En bordure du volume d'émission","Dans le volume d'émission"][g.Eb1]+` (${coilN}, ${zTxt}).`;
  if(alloy==="nonmetal"){ b1=0; bWhy+=" Matériau non métallique : pas d'échauffement par radiofréquence."; }
  else if(fil&&g.Eb1>=1){ b1=2; bWhy+=` Fil ou sonde : cas typique de l'échauffement par effet d'antenne, concentré à l'extrémité. À ${mag}, la longueur résonante en tissu est d'environ ${F.Lt} cm.`; }
  else if(small&&b1>0){ b1=0; bWhy+=" Élément de moins de 2 cm : pas d'échauffement préoccupant (un échauffement excessif suppose un objet conducteur allongé de plus de 2 cm ou une boucle)."; }
  else if(vasc&&b1>0){ b1=0; bWhy+=" Implant baigné dans le flux sanguin : la circulation évacue la chaleur (réduction de plus de 50 % de l'élévation de température dès 20 % du débit physiologique — Gross 2023). Condition : le mode SAR indiqué plus bas."; }
  else if(conduit&&b1>1){ b1=1; bWhy+=" Stent non vasculaire : pas de refroidissement par le flux sanguin. Rester en mode SAR normal."; }
  else if(ortho&&b1>0){
    if(oType==="prothese"||oType==="vis"){ b1=0; bWhy+=" Prothèse, vis, plaque ou cerclage : réalisable sous la condition de mode SAR indiquée plus bas."; }
    else if(oType==="rachis"){ b1=Math.min(b1,1); bWhy+=" Long montage (tiges, fixation rachidienne) : l'échauffement dépend de sa géométrie et de sa position ; rester en mode SAR normal."; }
    else bWhy+=" Fixateur externe : l'échauffement dépend de la configuration exacte ; seul l'étiquetage du fabricant pour cette configuration fait foi.";
  }
  else if(condPassif&&b1>1){ b1=1; bWhy+=" Étiqueté conditionnel : conçu pour supporter l'IRM en mode SAR normal — à respecter."; }
  if(!fil&&!small&&b1>=1&&(U.taille==="grand"||U.taille==="moyen")) bWhy+=` À ${mag}, la longueur résonante en tissu est d'environ ${F.Lt} cm : un objet de cette taille peut s'en approcher.`;
  if(g.Eb1>=1&&g.periph) bWhy+=" Position périphérique : le champ électrique y est plus intense qu'au centre.";
  out.push(E("B1","Échauffement (radiofréquence, B1)",b1,bWhy,"b1"));
  return out;
}

/* ---------- Motifs : 3 = IRM non recommandée · 2 = avis du médecin requis ---------- */
function uMotifs(){
  const m=[], st=U.struct, precis=U.compat==="conditionnel_precis";
  if(U.actifType==="capsule") m.push({k:"capsule",t:3});
  if(U.nature==="actif"&&!precis&&U.actifType!=="capsule") m.push({k:"actif_sans_doc",t:3});
  if(st==="oeil"&&U.alloy==="ferro") m.push({k:"oeil_ferro",t:3});
  if(st==="clip"&&!precis&&(U.clipYear==="avant"||U.clipYear==="inconnue")) m.push({k:"clip",t:3});
  if(U.ident==="inconnu"&&U.pt&&uGeom().Eb1===2&&(U.taille==="inconnue"||U.mobile==="inconnu")) m.push({k:"inconnu_proximal",t:3});
  if(U.compat==="non_compatible"&&U.nature!=="actif") m.push({k:"incompatible",t:2});
  if(st==="oeil"&&U.alloy!=="nonmetal") m.push({k:"oeil",t:2});
  if(st==="clip"&&!precis&&U.clipYear==="9599") m.push({k:"clip_9599",t:2});
  if(st==="valve"&&U.valveYear!=="autre") m.push({k:"valve",t:2});
  if(U.mobile==="recent"&&(st==="nerf"||st==="vital")) m.push({k:"migration",t:2});
  return m;
}
function uTier(){
  const M=uMotifs();
  if(M.some(x=>x.t===3)) return 3;
  const e=Math.max(...uEnergies().filter(x=>!x.info).map(x=>x.lv));
  return M.length?Math.max(2,e):e;
}
